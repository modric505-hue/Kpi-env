  var lab = WL.LABS[id], m = WL.MOD[id], st = ms(id), n = lab.predicts.length;
  var p = {}, base, stage = st.lab ? n : 0, locked = stage < n, verdict = null, order = null;
  lab.params.forEach(function (q) { p[q.k] = q.def; });
  function vals(pp) { var o = {}; lab.params.forEach(function (q) { o[q.k] = q.type === "sel" ? q.opts[pp[q.k]][1] : pp[q.k]; }); return o; }
  function setP(s) { Object.keys(s).forEach(function (k) { p[k] = s[k]; }); }
  function copy() { var o = {}; Object.keys(p).forEach(function (k) { o[k] = p[k]; }); return o; }
  if (locked) { setP(lab.predicts[0].set); }
  base = copy();

  function resHtml() {
    var r = lab.calc(vals(p)), hi = r.rows.filter(function (x) { return x.hi; })[0];
    var rows = r.rows.map(function (x) { return '<div class="res' + (x.hi ? ' hi' : '') + '"><span>' + esc(x.l) + '</span><b>' + f(x.v) + ' <small>' + esc(x.u) + '</small></b></div>'; }).join("");
    var ch = lab.params.filter(function (q) { return p[q.k] !== base[q.k]; }).map(function (q) {
      return q.type === "sel" ? q.l + " : " + q.opts[base[q.k]][0] + " → " + q.opts[p[q.k]][0] : q.l + " : " + f(base[q.k]) + " → " + f(p[q.k]) + (q.u ? " " + q.u : "");
    });
    var delta = "";
    if (ch.length) {
      var r0 = lab.calc(vals(base)), pct = r0.main ? (r.main / r0.main - 1) * 100 : null;
      delta = '<div class="delta"><b>Pourquoi le résultat change</b><p>Tu as modifié ' + esc(ch.join(" ; ")) + '. ' + esc(hi.l) + ' : ' + f(r0.main) + ' → ' + f(r.main) + ' ' + esc(hi.u)
        + (pct == null ? '' : ' (' + (pct >= 0 ? '+' : '−') + f(Math.abs(pct), 1) + ' %)') + '.</p><p>' + esc(lab.law) + '</p></div>';
    }
    return rows + (r.bars ? barsHtml(r.bars) : '') + (r.note ? '<p class="hint" style="margin-top:8px">' + esc(r.note) + '</p>' : '') + delta;
  }
  function paramsHtml() {
    return lab.params.map(function (q) {
      if (q.type === "sel") {
        return '<div class="prm"><label>' + esc(q.l) + '</label><div class="seg">' + q.opts.map(function (o, i) { return '<button data-sel="' + q.k + '" data-i="' + i + '" aria-pressed="' + (p[q.k] === i) + '"' + (locked ? ' disabled' : '') + '>' + esc(o[0]) + '</button>'; }).join("") + '</div></div>';
      }
      return '<div class="prm"><label for="r-' + q.k + '">' + esc(q.l) + '<b id="v-' + q.k + '">' + f(p[q.k]) + (q.u ? ' ' + q.u : '') + '</b></label>'
        + '<input type="range" id="r-' + q.k + '" data-k="' + q.k + '" min="' + q.min + '" max="' + q.max + '" step="' + q.step + '" value="' + p[q.k] + '"' + (locked ? ' disabled' : '') + '></div>';
    }).join("");
  }
  function draw(keepScroll) {
    var y = window.scrollY, ch = "";
    if (stage < n) {
      var pr = lab.predicts[stage];
      if (!order) { order = A.shuffle(pr.o.map(function (_, i) { return i; })); }
      ch = '<div class="card chal"><p class="mono hint">Défi ' + (stage + 1) + ' / ' + n + ' · prévois avant de tester</p><h2 class="q-title" style="margin-top:4px">' + esc(pr.q) + '</h2>';
      if (!verdict) {
        ch += '<div class="gap-s" style="margin-top:12px">' + order.map(function (oi) { return '<button class="choice" data-pred="' + oi + '"><span>' + esc(pr.o[oi]) + '</span>' + ui("chev") + '</button>'; }).join("") + '</div>'
          + '<button class="linkbtn" id="skip">Passer les défis et explorer librement</button>';
      } else {
        ch += '<div class="fb' + (verdict.ok ? '' : ' ko') + '" style="margin-top:12px"><h3>' + (verdict.ok ? 'Bien prévu.' : 'Ta prévision : « ' + esc(pr.o[verdict.oi]) + ' ». Réponse : « ' + esc(pr.o[pr.a]) + ' ».') + '</h3><p>' + esc(pr.why) + '</p></div>'
          + (!verdict.ok && WL.CONF[pr.tag] ? '<p class="hint" style="margin-top:8px">Confusion repérée : ' + esc(WL.CONF[pr.tag].name) + '. Elle est notée dans « Réviser ».</p>' : '')
          + '<p class="hint" style="margin-top:8px">Le simulateur ci-dessous affiche ce cas. Bouge les curseurs pour voir ce qui change, puis continue.</p>'
          + '<button class="btn" id="nextc" style="margin-top:12px">' + (stage + 1 < n ? 'Défi suivant' : 'Explorer librement') + '</button>';
      }
      ch += '</div>';
    }
    A.main.innerHTML =
      '<div class="page"><button class="back" id="back">' + ui("back") + esc(m.title) + '</button><p class="mono hint">Simulateur</p><h1>' + esc(lab.title) + '</h1></div>'
      + '<div class="stack" style="margin-top:14px">' + ch
      + '<div class="card sim"><div id="prm">' + paramsHtml() + '</div><div id="res" class="resbox">' + (locked ? '<p class="lock">Réponds au défi pour afficher le résultat.</p>' : resHtml()) + '</div></div>'
      + (stage >= n ? '<div class="callout reflex">' + ui("bulb") + '<div><h3>La loi à retenir</h3><p>' + esc(lab.law) + ' Vérifie-la en bougeant un seul curseur à la fois.</p></div></div>'
        + '<button class="btn" id="toproof">Prouver que je sais</button>' + (n ? '<button class="btn ghost" id="redo">Refaire les défis</button>' : '') : '')
      + '</div>';
    $("#back").addEventListener("click", function () { A.go("comp", { t: "mod", id: id }); });
    on("[data-pred]", function (b) {
      var oi = parseInt(b.getAttribute("data-pred"), 10), pr = lab.predicts[stage], ok = oi === pr.a;
      verdict = { ok: ok, oi: oi }; locked = false; base = copy();
      if (!ok) { conf(pr.tag, false); } A.buzz(ok ? 15 : [30, 40, 30]); A.save(); draw(true);
    });
    var sk = $("#skip"); if (sk) { sk.addEventListener("click", function () { stage = n; locked = false; verdict = null; base = copy(); st.lab = 1; A.save(); draw(true); }); }
    var nc = $("#nextc"); if (nc) { nc.addEventListener("click", function () {
      stage++; verdict = null; order = null;
      if (stage < n) { locked = true; setP(lab.predicts[stage].set); } else { st.lab = 1; A.save(); }
      base = copy(); draw(); A.toTop();
    }); }
    var rd = $("#redo"); if (rd) { rd.addEventListener("click", function () { stage = 0; verdict = null; order = null; locked = true; setP(lab.predicts[0].set); base = copy(); draw(); A.toTop(); }); }
    var tp = $("#toproof"); if (tp) { tp.addEventListener("click", function () { A.go("comp", { t: "proof", id: id }); }); }
    $$("input[type=range]").forEach(function (r) {
      r.addEventListener("input", function () {
        var k = r.getAttribute("data-k"), q = lab.params.filter(function (x) { return x.k === k; })[0];
        p[k] = parseFloat(r.value); $("#v-" + k).textContent = f(p[k]) + (q.u ? " " + q.u : ""); $("#res").innerHTML = resHtml();
      });
    });
    on("[data-sel]", function (b) {
      var k = b.getAttribute("data-sel"); p[k] = parseInt(b.getAttribute("data-i"), 10);
      $$('[data-sel="' + k + '"]').forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); $("#res").innerHTML = resHtml();
    });
    if (keepScroll) { try { window.scrollTo(0, y); } catch (e) {} }
  }
  draw();
}

/* ---------- épreuve : expliquer, calculer, appliquer ---------- */
function renderProof(id, rev) {
  var m = WL.MOD[id], st = ms(id), steps = rev ? ["calc", "apply"] : ["explain", "calc", "apply"], i = 0, failed = false;
  var names = { explain: "Expliquer", calc: "Calculer", apply: "Appliquer ailleurs" };
  function head() {
    return '<div class="page"><button class="back" id="back">' + ui("back") + esc(m.title) + '</button><p class="mono hint">' + (rev ? 'Révision' : 'Épreuve') + ' · étape ' + (i + 1) + ' / ' + steps.length + '</p><h1>' + names[steps[i]] + '</h1></div>'
      + '<div class="track"><i style="width:' + Math.round(100 * i / steps.length) + '%"></i></div>';
  }
  function back() { $("#back").addEventListener("click", function () { rev ? A.go("rev") : A.go("comp", { t: "mod", id: id }); }); }
  function nextBtn(box, label) {
    var b = document.createElement("button"); b.className = "btn"; b.style.marginTop = "14px"; b.textContent = label || (i + 1 < steps.length ? "Étape suivante" : "Terminer");
    b.addEventListener("click", function () { i++; if (i >= steps.length) { finish(); } else { step(); } }); box.appendChild(b);
    try { b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }
  function retryBtn(box, label, fn) {
    var b = document.createElement("button"); b.className = "btn"; b.style.marginTop = "14px"; b.textContent = label; b.addEventListener("click", fn); box.appendChild(b);
    try { b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }
  function step() {
    var k = steps[i]; A.toTop();
    if (k === "explain") {
      var ex = m.proof.explain;
      A.main.innerHTML = head() + '<div class="stack"><h2 class="q-title">' + esc(ex.q) + '</h2>'
        + '<p class="hint">Écris ta réponse, ou dis-la à voix haute. Tu la compareras ensuite à une réponse modèle.</p>'
        + '<textarea id="ans" rows="5" placeholder="Ta réponse, avec tes mots"></textarea><button class="btn" id="cmp">Comparer avec la réponse modèle</button><div id="model"></div></div>';
      back();
      $("#cmp").addEventListener("click", function () {
        $("#cmp").hidden = true;
        $("#model").innerHTML = '<div class="card"><b>Réponse modèle</b><p style="margin-top:6px">' + esc(ex.model) + '</p></div>'
          + '<h2 class="sec">Coche ce que ta réponse contenait</h2><div class="gap-s">' + ex.keys.map(function (t, j) { return '<label class="chk"><input type="checkbox" data-key="' + j + '"><span>' + esc(t) + '</span></label>'; }).join("") + '</div>'
          + '<button class="btn" id="okx" style="margin-top:14px">Valider mon explication</button><div id="xfb"></div>';
        $("#okx").addEventListener("click", function () {
          var c = $$("[data-key]").filter(function (x) { return x.checked; }).length, need = ex.keys.length - 1;
          if (c >= need) { $("#okx").hidden = true; $("#xfb").innerHTML = '<div class="fb"><h3>Explication validée.</h3><p>' + (c === ex.keys.length ? 'Tous les points clés y sont.' : 'Il manquait un point : relis-le dans la réponse modèle.') + '</p></div>'; nextBtn($("#xfb")); }
          else { $("#xfb").innerHTML = '<div class="fb ko"><h3>Il manque ' + (ex.keys.length - c) + ' points clés.</h3><p>Relis la réponse modèle, cache-la mentalement, puis reformule en incluant les points non cochés. Coche-les quand tu sais les dire.</p></div>'; }
        });
      });
    } else if (k === "calc") {
      A.main.innerHTML = head() + '<div class="stack"><p class="hint">Un calcul avec des valeurs nouvelles. Deux essais : au premier écart, tu reçois un diagnostic.</p><div id="ex"></div><div id="after"></div></div>';
      back();
      var run = function () {
        $("#after").innerHTML = "";
        X.exercise($("#ex"), WL.GEN[id](), function (ok, tag) {
          if (tag) { conf(tag, false); } A.save();
          if (ok) { nextBtn($("#after")); }
          else { failed = true; $("#after").innerHTML = (tag ? diagHtml(tag).replace(/<button class="btn ghost" data-chk[^]*$/, "</div>") : ""); retryBtn($("#after"), "Réessayer avec d'autres valeurs", run); }
        });
      };
      run();
    } else {
      A.main.innerHTML = head() + '<div class="stack"><p class="hint">Une situation que la notion n\'a pas montrée telle quelle.</p><div id="ex"></div><div id="after"></div></div>';
      back();
      var runA = function () {
        $("#after").innerHTML = "";
        var a = m.proof.apply[(st.k || 0) % m.proof.apply.length];
        X.exercise($("#ex"), { type: "mc", q: a.q, o: a.o }, function (ok, tag) {
          if (tag) { conf(tag, false); } A.save();
          if (ok) { nextBtn($("#after")); }
          else { failed = true; st.k = (st.k || 0) + 1; $("#after").innerHTML = (tag ? diagHtml(tag).replace(/<button class="btn ghost" data-chk[^]*$/, "</div>") : ""); retryBtn($("#after"), "Réessayer avec une autre situation", runA); }
        });
      };
      runA();
    }
  }
  function finish() {
    var t = today();
    st.k = (st.k || 0) + 1;
    if (!rev || !st.t) { st.t = st.t || t; st.rev = st.rev || 0; st.due = t + (failed ? 1 : MODINT[0]); }
    else if (failed) { st.due = t + 1; }
    else { st.rev = (st.rev || 0) + 1; st.due = t + MODINT[Math.min(st.rev, MODINT.length - 1)]; }
    A.save(); A.toTop();
    var nxt = WL.MODS[m.n];
    A.main.innerHTML = '<p class="qctx" style="margin-top:10px">' + esc(m.title) + '</p><div class="big">✓</div><p class="verdict">' + (rev ? (failed ? 'Révision faite, à consolider.' : 'Révision réussie.') : 'Notion acquise.') + '</p>'
      + '<div class="card" style="margin-top:16px"><b>Prochaine vérification : ' + dayLabel(st.due) + '</b><p class="hint" style="margin-top:4px">' + (failed ? 'Une étape a demandé plusieurs essais : la notion revient dès demain, avec de nouvelles valeurs.' : 'Tu la retrouveras dans « Réviser », avec un calcul neuf et une autre situation. Chaque réussite espace la suivante.') + '</p></div>'
      + '<div class="stack" style="margin-top:22px">' + (nxt && !rev ? '<button class="btn" id="nx">Notion suivante : ' + esc(nxt.title) + '</button>' : '')
      + '<button class="btn ghost" id="bk">' + (rev ? 'Retour aux révisions' : 'Retour à la notion') + '</button></div>';
    var nx = $("#nx"); if (nx) { nx.addEventListener("click", function () { A.go("comp", { t: "mod", id: nxt.id }); }); }
    $("#bk").addEventListener("click", function () { rev ? A.go("rev") : A.go("comp", { t: "mod", id: id }); });
  }
  step();
}

/* ---------- Réviser ---------- */
X.renderRev = function () {
  var sub = A.S.sub;
  if (sub && sub.t === "conf" && WL.CONF[sub.id]) { return renderConf(sub.id); }
  if (sub && sub.t === "backup") { return renderBackup(); }
  var dq = X.dueQ(), dm = X.dueMods(), t = today(), st = A.store;
  var nextDue = null;
  Object.keys(st.sr).forEach(function (id) { var d = st.sr[id].d; if (d > t && (nextDue == null || d < nextDue)) { nextDue = d; } });
  WL.MODS.forEach(function (m) { var s = st.mods[m.id]; if (s && s.t && s.due > t && (nextDue == null || s.due < nextDue)) { nextDue = s.due; } });
  var todayHtml = "";
  if (dq.length) { todayHtml += '<button class="mode" id="srq"><span class="num">' + ui("target") + '</span><span><span class="t">Questions à revoir</span><br><span class="s">Celles dont l\'échéance est arrivée</span></span><span class="b">' + dq.length + '</span></button>'; }
  dm.forEach(function (m) { todayHtml += '<button class="mode" data-rev="' + m.id + '"><span class="num">' + m.n + '</span><span><span class="t">Re-prouver : ' + esc(m.title) + '</span><br><span class="s">Un calcul neuf, une autre situation</span></span><span class="b">' + ui("chev") + '</span></button>'; });
  if (!todayHtml) {
    todayHtml = '<div class="card"><b>Rien à réviser aujourd\'hui.</b><p class="hint" style="margin-top:4px">' + (nextDue != null ? 'Prochaine échéance : ' + dayLabel(nextDue) + '.' : 'Les révisions se remplissent à mesure que tu réponds aux quiz et que tu valides des notions.') + '</p></div>';
  }
  var tags = Object.keys(st.conf).filter(function (k) { return WL.CONF[k] && st.conf[k].w > 0; }).sort(function (a, b) { return (st.conf[b].w - st.conf[b].ok) - (st.conf[a].w - st.conf[a].ok); });
  var confHtml = tags.length ? '<ul class="list">' + tags.map(function (k) {
    var c = st.conf[k], solved = c.ok >= c.w;
    return '<li><button class="item" data-conf="' + k + '"><span class="num ' + (solved ? 'c-ok' : 'c-ko') + '">' + (solved ? '✓' : c.w - c.ok) + '</span><span><span class="t">' + esc(WL.CONF[k].name) + '</span><span class="s" style="display:block">' + c.w + (c.w > 1 ? ' erreurs' : ' erreur') + ' · ' + c.ok + (c.ok > 1 ? ' vérifications réussies' : ' vérification réussie') + '</span></span>' + ui("chev", "go") + '</button></li>';
  }).join("") + '</ul>' : '<div class="empty">Aucune confusion repérée pour l\'instant. Elles apparaissent ici dès qu\'une erreur en révèle une.</div>';
  var acq = '<ul class="list">' + WL.MODS.map(function (m) {
    var s = st.mods[m.id] || {}, line = s.t ? ((s.rev || 0) >= 2 ? 'Consolidé' : 'Acquis le ' + dayLabel(s.t)) + ' · ' + (s.rev || 0) + (s.rev > 1 ? ' révisions' : ' révision') + ' · ' + (s.due <= t ? 'à re-prouver aujourd\'hui' : 'prochaine le ' + dayLabel(s.due)) : 'À prouver';
    return '<li><button class="item' + (s.t ? ' done' : '') + '" data-mod="' + m.id + '"><span class="num">' + m.n + '</span><span><span class="t">' + esc(m.title) + '</span><span class="s" style="display:block">' + line + '</span></span>' + ui("chev", "go") + '</button></li>';
  }).join("") + '</ul>';
  A.main.innerHTML =
    '<div class="page"><h1>Réviser</h1><p class="sub">Ce qui est dû aujourd\'hui, tes confusions à lever, et ce que tu as prouvé.</p></div>'
    + '<h2 class="sec">Aujourd\'hui</h2><div class="stack">' + todayHtml + '</div>'
    + '<h2 class="sec">Mes confusions</h2>' + confHtml
    + '<h2 class="sec">Mes acquis</h2>' + acq
    + '<button class="btn ghost" id="bkp" style="margin-top:18px">Sauvegarder ou restaurer ma progression</button>';
  var q = $("#srq"); if (q) { q.addEventListener("click", function () { A.start("sr", "Révision du jour", A.shuffle(dq).slice(0, 12)); }); }
  on("[data-rev]", function (b) { A.go("comp", { t: "proof", id: b.getAttribute("data-rev"), rev: 1 }); });
  on("[data-conf]", function (b) { A.go("rev", { t: "conf", id: b.getAttribute("data-conf") }); });
  on("[data-mod]", function (b) { A.go("comp", { t: "mod", id: b.getAttribute("data-mod") }); });
  $("#bkp").addEventListener("click", function () { A.go("rev", { t: "backup" }); });
};

    '<div class="qtop"><button class="back" id="quit" aria-label="Quitter le quiz">' + ui("back") + 'Quitter</button><span class="count">' + pad(s.i + 1) + ' / ' + pad(n) + '</span></div>'
    + '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + s.i + '"><i style="width:' + Math.round(100 * s.i / n) + '%"></i></div>'
    + (q.ctx ? '<p class="qctx">' + esc(q.ctx) + '</p>' : '<p class="qctx">' + esc(s.label) + '</p>')
    + qDoc(q)
    + '<h2 class="q" id="qtext" tabindex="-1">' + esc(q.q) + '</h2>'
    + '<ul class="opts">' + opts + '</ul><div id="fb"></div><div class="dock" id="dock" hidden></div>';
  byId("quit").addEventListener("click", function () { sess = null; render(); });
  Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
    b.addEventListener("click", function () { answer(parseInt(b.getAttribute("data-oi"), 10)); });
  });
  try { byId("qtext").focus({ preventScroll: true }); } catch (e) {}
}
function answer(oi) {
  var s = sess; if (s.answered) { return; }
  s.answered = true;
  var q = QBY[s.ids[s.i]], ok = oi === q.a;
  if (ok) { s.score++; store.missed = store.missed.filter(function (id) { return id !== q.id; }); buzz(15); }
  else { s.wrong.push(q.id); if (store.missed.indexOf(q.id) < 0) { store.missed.push(q.id); } buzz([30, 40, 30]); }
  var diag = WL.X.onQuiz(q, ok);
  save();
  Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
    var v = parseInt(b.getAttribute("data-oi"), 10), m = b.querySelector(".mark");
    b.setAttribute("aria-disabled", "true");
    if (v === q.a) { b.classList.add("ok"); m.textContent = "✓"; }
    else if (v === oi) { b.classList.add("ko"); m.textContent = "✗"; }
    else { b.classList.add("dim"); }
  });
  byId("fb").innerHTML = '<div class="fb' + (ok ? '' : ' ko') + '" role="status"><h3>' + (ok ? 'Juste.' : 'Raté.') + '</h3><p>' + esc(q.e) + '</p></div>' + diag;
  WL.X.bindDiag(byId("fb"));
  var last = s.i === s.ids.length - 1, dock = byId("dock");
  dock.hidden = false;
  dock.innerHTML = '<button class="btn" id="next">' + (last ? 'Voir le résultat' : 'Question suivante') + ' →</button>';
  var nb = byId("next"); nb.addEventListener("click", nextQ);
  try { nb.scrollIntoView({ block: "nearest", behavior: "smooth" }); nb.focus({ preventScroll: true }); } catch (e) {}
}
function nextQ() {
  var s = sess; s.i++; s.answered = false; s.order = null;
  if (s.i >= s.ids.length) { finish(); } else { renderQuestion(); }
}
function finish() {
  var s = sess; s.done = true;
  var n = s.ids.length;
  if (s.key !== "review" && s.key !== "sr") { var b = store.best[s.key]; if (!b || s.score / n > b.s / b.t) { store.best[s.key] = { s: s.score, t: n }; } }
  save(); renderResult();
}
function renderResult() {
  var s = sess, n = s.ids.length; toTop(); drawTabs();
  var r = s.score / n, verdict = r >= 0.9 ? "Solide." : r >= 0.7 ? "Bon niveau." : r >= 0.5 ? "À consolider." : "À reprendre.";
  var wrong = s.wrong.length ? '<h2 class="sec" style="margin-top:24px">À retenir</h2><ul class="miss">'
    + s.wrong.map(function (id) { var q = QBY[id]; return '<li><b>' + esc(q.q) + '</b><span>' + esc(q.o[q.a]) + '</span><p class="hint" style="margin-top:4px">' + esc(q.e) + '</p></li>'; }).join("") + '</ul>' : '';
  main.innerHTML =
    '<p class="qctx" style="margin-top:10px">' + esc(s.label) + '</p><div class="big">' + s.score + '<small> / ' + n + '</small></div><p class="verdict">' + verdict + '</p>'
    + wrong
    + '<div class="stack" style="margin-top:22px">'
    + (s.wrong.length ? '<button class="btn" id="redo">Refaire les erreurs (' + s.wrong.length + ')</button>' : '')
    + '<button class="btn' + (s.wrong.length ? ' ghost' : '') + '" id="again">Rejouer</button><button class="btn ghost" id="home">Retour aux quiz</button></div>';
  var rd = byId("redo"); if (rd) { rd.addEventListener("click", function () { start("review", "À revoir", shuffle(s.wrong)); }); }
  byId("again").addEventListener("click", function () {
    if (s.key === "sr") { sess = null; go("rev"); }
    else if (s.key === "review") { cleanMissed(); if (store.missed.length) { start("review", "À revoir", shuffle(store.missed)); } else { sess = null; render(); } }
    else { startMode(s.key); }
  });
  byId("home").addEventListener("click", function () { var sr = s.key === "sr"; sess = null; if (sr) { go("rev"); } else { render(); } });
  if (s.key === "sr") { byId("again").textContent = "Retour aux révisions"; byId("home").hidden = true; }
}

/* ---------- Glossaire ---------- */
function glossRows(qs) {
  var q = qs.trim().toLowerCase();
  var rows = WL.GLOSS.filter(function (g) { return !q || g[0].toLowerCase().indexOf(q) >= 0 || g[1].toLowerCase().indexOf(q) >= 0; });
  if (!rows.length) { return '<div class="empty">Aucun terme ne correspond.</div>'; }
  return rows.map(function (g) { return '<div class="g"><b>' + esc(g[0]) + '</b><span>' + esc(g[1]) + '</span></div>'; }).join("");
}
function renderGloss() {
  main.innerHTML =
    '<div class="page"><button class="back" id="backf">' + ui("back") + 'Fiches</button><h1>Glossaire</h1><p class="sub">' + WL.GLOSS.length + ' termes anglais, avec leur traduction française.</p></div>'
    + '<div class="search"><label>' + ui("search") + '<input id="gq" type="search" inputmode="search" placeholder="Chercher : petrol, essence, steam…" autocomplete="off" aria-label="Chercher un terme"></label></div>'
    + '<div class="list" id="glist" style="margin-top:6px">' + glossRows("") + '</div>';
  byId("backf").addEventListener("click", function () { go("fiches"); });
  byId("gq").addEventListener("input", function () { byId("glist").innerHTML = glossRows(this.value); });
}

/* ---------- démarrage ---------- */
WL.X.init({ ui: ui, esc: esc, shuffle: shuffle, byId: byId, store: store, save: save, load: loadStore, go: go, S: S, main: main, buzz: buzz, toTop: toTop, start: start, QBY: QBY });
var hot = window.claude && window.claude.hot;
function boot(data) {
  if (data && data.S && typeof data.S.tab === "string") {
    S.tab = /^(bases|fiches|classer|gloss|comp|quiz|rev)$/.test(data.S.tab) ? data.S.tab : "bases"; S.sub = data.S.sub || null; S.filter = data.S.filter || "all";
    if (data.S.cls && Array.isArray(data.S.cls.stack)) { S.cls = data.S.cls; }
    var d = data.sess;
    if (d && Array.isArray(d.ids) && d.ids.every(function (id) { return QBY[id]; })) {
      sess = d;
      if (!sess.done && sess.answered) { sess.i++; sess.answered = false; sess.order = null; if (sess.i >= sess.ids.length) { finish(); return; } }
    }
    if (S.sub && S.sub.t === "kpi" && !WL.KPI[S.sub.id]) { S.sub = null; }
    if (S.sub && S.sub.t === "lesson" && !WL.LESSONS.some(function (l) { return l.id === S.sub.id; })) { S.sub = null; }
  }
  render();
}
if (hot && typeof hot.snapshot === "function") { hot.snapshot(function () { return { S: S, sess: sess }; }); }
if (hot && typeof hot.ready === "function") { hot.ready(boot); } else { boot((hot && hot.data) || {}); }

})(window.WL);

</script>

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
