<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Indicateurs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<title>Indicateurs Worldline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field notebook. Each indicator is a labelled unit tag (L, kWh, kg, km) with its own colour; the unit colours are the only loud thing. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#10213F; --muted:#586884; --line:#DAE0EA;
  --uL:#B45F06; --ukWh:#2551D9; --ukg:#0B8573; --ukm:#7442C8; --unb:#B8336A;
  --good:#17714B; --good-bg:#E3F4EB; --bad:#B42323; --bad-bg:#FBE7E7; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#131F36; --ink:#E8EEF9; --muted:#9AA9C5; --line:#26385C;
    --uL:#FFB454; --ukWh:#8AA8FF; --ukg:#4FD6BF; --ukm:#B997FF; --unb:#FF8FBF;
    --good:#5FD39A; --good-bg:#12302A; --bad:#FF8B8B; --bad-bg:#3A1A22; --warn:#FFC966; --warn-bg:#3A2D10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#131F36; --ink:#E8EEF9; --muted:#9AA9C5; --line:#26385C;
  --uL:#FFB454; --ukWh:#8AA8FF; --ukg:#4FD6BF; --ukm:#B997FF; --unb:#FF8FBF;
  --good:#5FD39A; --good-bg:#12302A; --bad:#FF8B8B; --bad-bg:#3A1A22; --warn:#FFC966; --warn-bg:#3A2D10;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ukWh);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(92px + env(safe-area-inset-bottom,0px))}
.stack{display:grid;gap:14px}
.gap-s{display:grid;gap:8px}

/* Unit colours */
.u-L{--u:var(--uL)} .u-kWh{--u:var(--ukWh)} .u-kg{--u:var(--ukg)} .u-km{--u:var(--ukm)} .u-nb{--u:var(--unb)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:3px 9px;border-radius:7px;font-family:var(--mono);font-weight:600;font-size:13px;line-height:1.3;color:var(--u);background:color-mix(in srgb,var(--u) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 40%,var(--surface))}
.chip.big{font-size:20px;padding:6px 14px;border-radius:10px}
.pill{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.ico{width:44px;height:44px;color:var(--ink);--acc:var(--u,var(--ukWh));flex:none}
.a{fill:var(--acc);stroke:none}
.at{fill:var(--acc);fill-opacity:.16}
.ui{width:24px;height:24px;flex:none}

/* Home / header */
.hero h1{font-size:clamp(30px,8.6vw,40px);line-height:1.04;font-weight:800;letter-spacing:-.015em;margin:0 0 8px;font-variation-settings:"opsz" 60}
.hero .lede{color:var(--muted);max-width:42ch}
.unitstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.unitstrip div{padding:12px 6px;border-radius:12px;text-align:center;background:color-mix(in srgb,var(--u) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 35%,var(--surface))}
.unitstrip b{display:block;font-family:var(--mono);font-size:19px;color:var(--u)}
.unitstrip span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.sec{font-family:var(--mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.progress div{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.progress b{font-family:var(--mono);font-size:20px;display:block}
.progress span{font-size:12px;color:var(--muted)}

/* Lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 14px;background:none;border:0;text-align:left}
.item:active{background:var(--bg)}
.item .t{font-family:var(--display);font-weight:700;line-height:1.2}
.item .s{font-size:13px;color:var(--muted);line-height:1.3;margin-top:2px}
.item .go{color:var(--muted);width:18px;height:18px}
.item.done .t::after{content:" ✓";color:var(--good)}
.num{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--bg);font-family:var(--mono);font-weight:600}

/* Filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Page header */
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 0;margin-left:-4px;background:none;border:0;font-weight:700;color:var(--muted)}
.back .ui{width:20px;height:20px}
.page h1{font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.01em}
.page .sub{color:var(--muted);margin-top:4px}

/* KPI detail */
.kpihero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:color-mix(in srgb,var(--u) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 32%,var(--surface))}
.kpihero .ico{width:96px;height:96px}
.kpihero .meta{display:grid;gap:8px;justify-items:start}
.quote{font-family:var(--display);font-size:19px;line-height:1.3;font-weight:600;text-wrap:pretty}
.blk h2{font-size:13px;font-family:var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.blk p{text-wrap:pretty}
.callout{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:14px;border-radius:14px}
.callout.warn{background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--surface))}
.callout.warn .ui{color:var(--warn)}
.callout.reflex{background:color-mix(in srgb,var(--ukWh) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--ukWh) 35%,var(--surface))}
.callout.reflex .ui{color:var(--ukWh)}
.callout h3{font-size:14px;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:left}
.link .ico{width:28px;height:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:14px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.on{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.btn:active{transform:scale(.99)}

/* Fake document */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(16,33,63,.35);position:relative;overflow:hidden}
.doc::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.doc header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 14px 8px;font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.doc header em{font-style:normal;border:1px dashed var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 14px;font-family:var(--mono);font-size:13px;border-top:1px dotted var(--line)}
.drow span:first-child{color:var(--muted)}
.drow span:last-child{text-align:right;font-weight:500}
.drow.hi{padding-bottom:22px;background:color-mix(in srgb,var(--u) 13%,var(--surface));border-top:1px solid color-mix(in srgb,var(--u) 40%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--u) 40%,var(--surface));position:relative}
.drow.hi span:last-child{color:var(--u);font-weight:600}
.drow.hi::after{content:"à saisir";position:absolute;right:14px;bottom:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--u);font-family:var(--mono);font-weight:600}
.dnote{padding:10px 14px 12px;font-size:12.5px;color:var(--muted)}
.dpad{height:12px}

/* Lessons */
.lesson{display:grid;gap:16px}
.lesson h2{font-size:21px;line-height:1.15;font-weight:800}
.lesson p{text-wrap:pretty}
.lesson ul,.lesson ol{margin:0;padding-left:20px;display:grid;gap:6px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
.fig text{font-family:var(--body);fill:var(--ink)}
.fig .m{font-family:var(--mono)}
.fig .mu{fill:var(--muted)}
.eq{display:grid;gap:8px}
.eq>div{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.eq .op{background:none;border:0;padding:0;text-align:center;font-family:var(--mono);font-size:22px;color:var(--muted);line-height:1}
.eq.key>div:first-child{border-color:var(--ukWh);background:color-mix(in srgb,var(--ukWh) 9%,var(--surface))}
.eq b{font-family:var(--display)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:table}
.tbl th,.tbl td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
.bad{color:var(--bad);font-weight:700}
.ok{color:var(--good);font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:8px!important}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-weight:600}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pair .en{font-family:var(--mono);font-weight:600}
.pair .fr{font-family:var(--display);font-weight:800;font-size:18px}
.pair .ar{color:var(--muted);font-size:20px}
.pair .no{grid-column:1/-1;font-size:13px;color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv>div{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kv b{display:block;font-family:var(--display);font-size:16px}
.kv span{font-size:13px;color:var(--muted)}
.done-row{margin-top:6px}

/* Classer */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.crumbs span{font-size:12.5px;padding:3px 9px;background:var(--surface);border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.q-title{font-size:24px;line-height:1.15;font-weight:800}
.choice{display:grid;grid-template-columns:1fr 20px;gap:12px;align-items:center;width:100%;min-height:60px;padding:12px 16px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;font-weight:600}
.choice:active{background:var(--bg)}
.choice .ui{width:18px;height:18px;color:var(--muted)}
.result{padding:20px;border-radius:20px;background:color-mix(in srgb,var(--u) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--u) 35%,var(--surface));display:grid;gap:12px;justify-items:start}
.result .ico{width:80px;height:80px}
.result h2{font-size:26px;line-height:1.1;font-weight:800}
.surv .item{min-height:56px}

/* Quiz */
.mode{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.mode .ui{width:28px;height:28px;margin:auto}
.mode .t{font-family:var(--display);font-weight:700}
.mode .s{font-size:13px;color:var(--muted)}
.mode .b{font-family:var(--mono);font-size:13px;text-align:right}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-family:var(--mono);font-size:14px;font-weight:600}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0 8px}
.track i{display:block;height:100%;background:var(--ukWh);transition:width .25s ease}
.qctx{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 8px}
.q{font-family:var(--display);font-size:21px;line-height:1.25;font-weight:700;text-wrap:pretty;margin:14px 0 16px;outline:none}
.doc.sm{margin-top:4px}
.doc.sm .drow{border-top:1px dotted var(--line);font-size:13.5px}
.doc.sm .drow span:first-child{color:var(--ink)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr 20px;gap:12px;align-items:center;width:100%;min-height:58px;padding:12px 14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.opt .ltr{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--bg);font-family:var(--mono);font-weight:600;font-size:13px}
.opt .mark{font-weight:800;text-align:center}
.opt[aria-disabled="true"]{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .mark{color:var(--good)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)} .opt.ko .mark{color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--good)}
.fb.ko{border-left-color:var(--bad)}
.fb h3{font-size:16px;margin-bottom:4px}
.dock{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:14px -16px 0;padding:12px 16px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.big{font-family:var(--mono);font-weight:600;font-size:64px;line-height:1;margin:14px 0 6px}
.big small{font-size:28px;color:var(--muted)}
.verdict{font-family:var(--display);font-size:22px;font-weight:800;margin-bottom:10px}
.miss{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.miss li{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.miss b{display:block;margin-bottom:4px;font-weight:600}
.miss span{color:var(--good);font-weight:700}

/* Glossary */
.search{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 10px;background:var(--bg)}
.search label{position:relative;display:block}
.search .ui{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{width:100%;min-height:48px;padding:0 14px 0 40px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px}
.g+ .g{border-top:1px solid var(--line)}
.g b{font-family:var(--mono);font-weight:600;font-size:14px}
.g span{font-family:var(--display);font-weight:600}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:8px 2px 6px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;position:relative}
.tab .ui{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ukWh)}

@media (prefers-reduced-motion: reduce){.track i{transition:none}.btn:active{transform:none}}

/* Figures & small additions */
.fig .bld{fill:var(--bg);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig .ln{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .ar{stroke:var(--muted);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .tx{font-size:12.5px;font-weight:700;text-anchor:middle}
.fig .tx2{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.fig .tx3{font-family:var(--mono);font-size:13px;font-weight:600;text-anchor:middle}
.fig .uL{--acc:var(--uL);color:var(--ink)} .fig .ukWh{--acc:var(--ukWh);color:var(--ink)}
.doc.sm .drow.single{justify-content:flex-start}
.doc.sm .drow.single span{color:var(--ink)!important;text-align:left}
.doc.sm header{padding-top:16px}
.hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .chip{margin-bottom:6px}

/* ---- Comprendre, simulateurs, épreuves, révisions ---- */
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--unb);border:2px solid var(--surface)}
.tab span{white-space:nowrap}
.btn.sm{min-height:46px;font-size:14px;padding:8px 10px;gap:6px} .btn.sm .ui{width:20px;height:20px}
.st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--good-bg);color:var(--good)} .st.run{background:var(--warn-bg);color:var(--warn)}
.num.c-ok{background:var(--good-bg);color:var(--good)} .num.c-ko{background:var(--bad-bg);color:var(--bad)}
.num .ui{width:24px;height:24px}
.trail{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 4px}
.trail span{padding:7px 4px;border-radius:9px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.trail span.on{color:var(--ukWh);border-color:color-mix(in srgb,var(--ukWh) 45%,var(--surface));background:color-mix(in srgb,var(--ukWh) 10%,var(--surface))}
.lesson .doc{margin:0}
.pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.pre+.pre{margin-top:8px}
.pre summary{min-height:48px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;list-style:none;font-size:15px;line-height:1.3;padding:8px 0}
.pre summary::-webkit-details-marker{display:none}
.pre summary::before{content:"+";font-family:var(--mono);font-size:18px;color:var(--ukWh);width:16px;flex:none}
.pre[open] summary::before{content:"−"}
.pre p{padding:0 0 14px 24px;color:var(--ink);font-size:15px}
.formula{display:grid;gap:4px;padding:16px;border-radius:14px;text-align:center;background:color-mix(in srgb,var(--ukWh) 9%,var(--surface));border:1.5px solid var(--ukWh)}
.formula span{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.formula b{font-family:var(--mono);color:var(--ukWh);font-size:18px;line-height:1}
.fig.flow svg{width:100%;height:auto;display:block}
.fx-b{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.fx-k{stroke:var(--ukWh);fill:color-mix(in srgb,var(--ukWh) 10%,var(--surface))}
.fx-t{font-family:var(--display);font-weight:700;font-size:12.5px;fill:var(--ink)}
.fx-s{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.fx-a{stroke:var(--muted);stroke-width:1.8;fill:none} .fx-h{fill:var(--muted)}
.fx-l{stroke:var(--bad)} .fx-lh{fill:var(--bad)} .fx-lt{fill:var(--bad)}
.fx-g{stroke:var(--good)} .fx-gh{fill:var(--good)} .fx-gt{fill:var(--good)}
.bars{display:grid;gap:7px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(84px,34%) 1fr;grid-template-areas:"l v" "b b";gap:2px 8px;align-items:baseline;font-size:13px}
.bar span{grid-area:l;color:var(--muted);line-height:1.2}
.bar b{grid-area:v;text-align:right;font-family:var(--mono);font-weight:600;font-size:13px}
.bar i{grid-area:b;height:10px;border-radius:5px;background:var(--ukWh);min-width:4px;transition:width .2s ease}
.bar.pos i{background:var(--good)} .bar.neg i{background:var(--bad)}
.sim{display:grid;gap:16px}
.prm+.prm{margin-top:12px}
.prm label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--muted);font-weight:600}
.prm label b{font-family:var(--mono);color:var(--ink);font-size:15px;white-space:nowrap}
.prm input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--ukWh)}
.prm input[type=range]:disabled{opacity:.45}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{min-height:40px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--ukWh);background:color-mix(in srgb,var(--ukWh) 12%,var(--surface));color:var(--ukWh)}
.seg button:disabled{opacity:.5}
.resbox{border-top:1px dashed var(--line);padding-top:14px}
.res{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:14px}
.res span{color:var(--muted)} .res b{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap} .res small{font-weight:400;color:var(--muted);font-size:12px}
.res.hi{padding:10px 12px;margin-bottom:6px;border-radius:12px;background:color-mix(in srgb,var(--ukWh) 10%,var(--surface))}
.res.hi span{color:var(--ink);font-weight:700} .res.hi b{font-size:19px;color:var(--ukWh)}
.lock{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px;border:1.5px dashed var(--line);border-radius:12px}
.delta{margin-top:12px;padding:12px;border-radius:12px;background:var(--warn-bg);font-size:14px}
.delta b{font-family:var(--display)} .delta p+p{margin-top:6px;color:var(--muted)}
.chal{border-color:var(--ukWh);border-width:1.5px}
.linkbtn{background:none;border:0;padding:10px 0 0;color:var(--ukWh);font-weight:700;font-size:14px;text-align:left;min-height:40px}
.exq{font-size:18px;line-height:1.3;margin-bottom:12px}
.numrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px}
.numin,textarea{width:100%;min-height:54px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;font-family:var(--mono)}
textarea{font-family:var(--body);font-size:16px;line-height:1.45;resize:vertical}
.sol{margin:8px 0 0;padding-left:20px;font-size:14.5px;display:grid;gap:4px}
.diag{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--surface));display:grid;gap:8px}
.diag h3{font-size:16px} .diag .pre{background:var(--surface)} .diag .chk{display:block}
label.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:15px}
label.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--good)}
.chain{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:0}
.chain li{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line);margin-left:8px}
.chain li:last-child{border-left-color:transparent;padding-bottom:0}
.chain li::before{content:"";position:absolute;left:-8px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--ukWh);border:3px solid var(--bg)}
.chain h3{font-size:17px;margin:6px 0 2px}
.g.src{display:grid;gap:3px;padding:12px 14px}
.g.src .mono{font-size:13.5px;color:var(--ink)} .g.src span:last-child{font-size:12.5px}
.g.src{grid-template-columns:1fr}
.g.src span:last-child{font-family:var(--body);font-weight:400;color:var(--muted)}
.lesson .pre+.pre{margin-top:-8px}
.lesson .formula+.card{margin-top:-6px}
.fig.flow{margin:0;padding:12px 8px}
.trail{margin-bottom:18px}
.fx-t{font-size:12px} .fx-s{font-size:11px}

[hidden]{display:none!important}

</style>

<p>La <b>puissance</b> dit à quelle vitesse on consomme l'énergie, à un instant donné. Elle se mesure en watts (W) ou kilowatts (kW). L'<b>énergie</b> est la quantité consommée sur une durée. Elle se mesure en kilowattheures (kWh).</p>

  bridges: [["m7", "La pointe de puissance explique le dimensionnement du réseau électrique."], ["m8", "Rapportés à la surface, les kWh deviennent l'intensité d'un bâtiment (kWh/m²)."], ["m10", "Une facture additionne un abonnement (lié aux kW) et une consommation (kWh)."]],
  proof: {
    explain: { q: "Explique à un collègue la différence entre kW et kWh, avec un exemple chiffré.", model: "Le kW mesure une puissance : la vitesse à laquelle un équipement consomme de l'énergie à un instant. Le kWh mesure une énergie : la quantité consommée sur une durée. On passe de l'une à l'autre en multipliant par le temps : un radiateur de 2 kW allumé 5 heures consomme 10 kWh. Les KPI de consommation se reportent en kWh.",
      keys: ["Le kW est une puissance : un débit d'énergie à un instant", "Le kWh est une énergie : une quantité sur une durée", "Énergie = puissance × temps, avec un exemple chiffré", "Les consommations se reportent en kWh"] },
    apply: [
      { q: "Un data center annonce une « puissance informatique de 2 MW ». S'il tourne en continu à cette puissance, que consomme-t-il en un an ?", o: [["17 520 MWh", 1, "", "2 MW × 8 760 heures dans l'année = 17 520 MWh."], ["2 MWh", 0, "pe", "2 MW est une puissance. Sans durée, on ne peut pas parler de consommation."], ["730 MWh", 0, "pe", "730 est à peu près le nombre d'heures d'un mois, et il manque la multiplication par 2 MW."]] },
      { q: "Une borne de 22 kW recharge une voiture pendant 30 minutes. Quelle énergie a-t-elle délivrée ?", o: [["11 kWh", 1, "", "22 kW × 0,5 h = 11 kWh."], ["22 kWh", 0, "pe", "Ce serait vrai pour une heure entière. Ici la durée est 0,5 h."], ["44 kWh", 0, "pe", "Tu as divisé par la durée au lieu de multiplier."]] }
    ] } },

{ id: "m2", title: "Du litre au kWh", sub: "Le contenu énergétique des combustibles", dom: ["comb", "ener"],
  entry: ["Deux documents du même site", ["Bon de livraison, diesel", "1 200 L"], ["Facture de gaz naturel", "84 300 kWh PCS"]],
  ask: "Pourquoi le diesel est-il en litres et le gaz en kWh, et peut-on les comparer ?",
  body: function () { return `
<p>Un combustible est de l'énergie chimique en réserve. Le brûler la libère sous forme de chaleur. Chaque combustible a un contenu énergétique par unité, le <b>pouvoir calorifique inférieur (PCI)</b> : environ 10 kWh par litre de gazole ou de fioul, environ 8,9 kWh par litre d'essence.</p>
${fig([{ t: "Volume", s: "1 200 L" }, { t: "× PCI", s: "10 kWh/L" }, { t: "Énergie", s: "12 000 kWh", k: 1 }], { alt: "Litres fois PCI égale kilowattheures", cap: "Le litre mesure le produit. Le kWh mesure ce que le produit peut donner en brûlant." })}
<p>On mesure des litres parce que c'est ce que voient la cuve et la pompe. Le gaz, lui, arrive par un tuyau : le compteur mesure des m³, que le fournisseur convertit en kWh sur la facture.</p>
<p><b>PCS ou PCI ?</b> La combustion produit de la vapeur d'eau. Le PCS (supérieur) compte aussi la chaleur qu'on récupérerait en condensant cette vapeur. Le PCI (inférieur) ne la compte pas. Pour le gaz naturel, PCS ≈ 1,11 × PCI. En France, le gaz est facturé en kWh PCS.</p>`; },
  pre: [
    ["Pourquoi brûler dégage-t-il de la chaleur ?", "Un combustible contient du carbone et de l'hydrogène. En brûlant, ils se combinent à l'oxygène de l'air pour former du CO₂ et de l'eau. Cette réaction libère de l'énergie, sous forme de chaleur."],
    ["Combien de kWh dans un m³ de gaz ?", "Entre 10 et 11 kWh PCS environ, selon la composition du gaz. Le coefficient exact figure sur la facture. C'est pourquoi on ne saisit jamais les m³ tels quels."]
  ],
  formula: ["Énergie (kWh PCI)", "Volume (L) × PCI (kWh/L)"],
  example: `1 200 L de gazole × 10 kWh/L = <b>${f(12000)} kWh</b>. La facture de gaz de 84 300 kWh PCS représente 84 300 ÷ 1,11 ≈ <b>${f(84300 / 1.11, 0)} kWh PCI</b>.`,
  limits: ["Le PCI varie un peu avec la température et la part de biocarburant : 10 kWh/L est un ordre de grandeur.", "Dans UL360, tu saisis l'unité attendue (les litres). La conversion sert à comprendre et à contrôler une cohérence, pas à saisir.", "Avant d'appliquer un facteur à des kWh de gaz, vérifie toujours s'ils sont en PCS ou en PCI."],
  bridges: [["m3", "Ces kWh sont l'énergie qui entre dans la machine. Ce qui en sort dépend du rendement."], ["m5", "Un facteur d'émission s'exprime par litre ou par kWh : il faut savoir lequel."], ["m9", "La consommation d'un véhicule (L/100 km) se lit aussi en kWh/100 km."]],
  proof: {
    explain: { q: "Pourquoi peut-on dire qu'un litre de gazole « vaut » environ 10 kWh, et à quoi sert cette équivalence ?", model: "Le gazole contient de l'énergie chimique que la combustion libère en chaleur. Le PCI donne cette énergie par litre : environ 10 kWh. L'équivalence permet de comparer des énergies mesurées dans des unités différentes et de contrôler un ordre de grandeur. Elle ne change pas l'unité de saisie : le diesel se reporte en litres.",
      keys: ["Le combustible contient une énergie chimique libérée par la combustion", "Le PCI est l'énergie par litre (≈ 10 kWh/L pour le gazole)", "Cela sert à comparer des énergies et à contrôler un ordre de grandeur", "L'unité de saisie reste le litre"] },
    apply: [
      { q: "Une chaudière au fioul a consommé 2 000 L. Le site voisin a consommé 25 000 kWh PCI de gaz. Lequel a consommé le plus d'énergie ?", o: [["Le site au gaz", 1, "", "2 000 L × 10 kWh/L = 20 000 kWh, contre 25 000 kWh."], ["Le site au fioul", 0, "pci", "2 000 L de fioul représentent environ 20 000 kWh : c'est moins que 25 000."], ["On ne peut pas comparer des litres et des kWh", 0, "pci", "On peut, en passant par le PCI : c'est justement son rôle."]] },
      { q: "Une facture de gaz affiche 111 000 kWh PCS. En kWh PCI, cela représente environ…", o: [["100 000 kWh", 1, "", "111 000 ÷ 1,11 = 100 000. Le PCI est toujours le plus petit des deux."], ["123 000 kWh", 0, "pci", "Tu as multiplié par 1,11. Le PCI est plus petit que le PCS : on divise."], ["111 000 kWh", 0, "pci", "PCS et PCI diffèrent d'environ 11 % pour le gaz naturel."]] }
    ] } },

{ id: "m3", title: "Le rendement", sub: "De l'énergie achetée à l'énergie utile", dom: ["ener", "chal", "comb"],
  entry: ["Groupe électrogène du data center", ["Diesel consommé", "1 800 L"], ["Électricité produite", "6 400 kWh"]],
  ask: "1 800 L de diesel contiennent environ 18 000 kWh. Où sont passés les 11 600 kWh manquants ?",
  body: function () { return `
<p>Aucune machine ne transforme toute l'énergie qu'elle reçoit en énergie utile. Une partie se dissipe en chaleur. L'énergie ne disparaît pas (elle se conserve toujours), mais elle devient inutilisable.</p>
<p>Le <b>rendement</b> est la part utile : énergie utile ÷ énergie consommée.</p>
${fig([{ t: "Diesel", s: "18 000 kWh" }, { t: "Groupe", s: "rendement 36 %" }, { t: "Électricité", s: "6 400 kWh", k: 1 }], { loss: "chaleur perdue : 11 600 kWh", alt: "Un groupe électrogène transforme 18 000 kWh de diesel en 6 400 kWh d'électricité", cap: "Ce qui entre (litres) et ce qui sort (kWh) sont deux données, donc deux KPI." })}
<table class="tbl"><tr><th>Machine</th><th>Rendement usuel</th></tr>
<tr><td>Chaudière gaz récente</td><td>90 % et plus</td></tr><tr><td>Moteur thermique de voiture</td><td>25 à 40 %</td></tr>
<tr><td>Groupe électrogène diesel</td><td>30 à 40 %</td></tr><tr><td>Moteur électrique</td><td>plus de 90 %</td></tr></table>
<p class="hint">Ordres de grandeur d'ingénierie, variables selon l'équipement et son usage.</p>`; },
  pre: [
    ["Passer d'un pourcentage à un coefficient", "90 % s'écrit 0,90. Diviser par 0,90 donne un résultat plus grand que le nombre de départ : 90 ÷ 0,90 = 100. Multiplier par 0,90 donne un résultat plus petit : 90 × 0,90 = 81."],
    ["Un rendement peut-il dépasser 100 % ?", "Jamais physiquement. Mais une chaudière à condensation affiche parfois plus de 100 % « sur PCI », parce qu'elle récupère la chaleur de la vapeur d'eau que le PCI ne compte pas. C'est un effet de convention."]
  ],
  formula: ["Énergie à acheter", "Énergie utile ÷ Rendement"],
  example: `Un bâtiment a besoin de 90 000 kWh de chaleur. Avec une chaudière à 90 % : 90 000 ÷ 0,90 = <b>${f(100000)} kWh</b> de gaz, dont ${f(10000)} kWh de pertes.`,
  limits: ["Le rendement nominal (catalogue) est supérieur au rendement réel sur une saison : charge partielle, entretien, cycles courts.", "Le rendement de la chaudière ne compte pas les pertes des tuyaux et de la régulation dans le bâtiment.", "Pour un groupe électrogène, le KPI de production porte sur ce qui sort (kWh), pas sur ce qui entre (litres)."],
  bridges: [["m4", "Une pompe à chaleur semble avoir un « rendement » de 300 %. Elle ne crée rien : elle déplace."], ["m7", "Les centrales thermiques ont aussi un rendement : c'est l'origine de l'énergie primaire."], ["m9", "Le faible rendement du moteur thermique explique l'avantage énergétique du moteur électrique."]],
  proof: {
    explain: { q: "Un groupe électrogène brûle 18 000 kWh de diesel et fournit 6 400 kWh d'électricité. Explique ce que cela signifie, et où est le reste.", model: "Son rendement est de 6 400 ÷ 18 000, soit environ 36 %. Le reste, environ 11 600 kWh, est dissipé en chaleur dans les gaz d'échappement et le refroidissement. L'énergie se conserve, mais elle se dégrade en chaleur inutilisée. Pour le reporting, le diesel consommé (en litres) et l'électricité produite (en kWh) sont deux données distinctes.",
      keys: ["Rendement = énergie utile ÷ énergie consommée, ici environ 36 %", "Le reste est dissipé en chaleur", "L'énergie se conserve : elle ne disparaît pas, elle se dégrade", "Diesel consommé et électricité produite sont deux données différentes"] },
    apply: [
      { q: "Deux chaudières couvrent le même besoin de chaleur. A a un rendement de 80 %, B de 95 %. Laquelle achète le plus de combustible ?", o: [["La chaudière A", 1, "", "Moins le rendement est bon, plus il faut acheter : besoin ÷ 0,80 est plus grand que besoin ÷ 0,95."], ["La chaudière B", 0, "rend", "Un meilleur rendement réduit l'achat. On divise le besoin par le rendement."], ["Les deux achètent autant", 0, "rend", "Le besoin est le même, mais l'énergie achetée dépend du rendement."]] },
      { q: "Un moteur électrique de rendement 90 % doit fournir 45 kWh de travail mécanique. Combien d'électricité consomme-t-il ?", o: [["50 kWh", 1, "", "45 ÷ 0,90 = 50 kWh."], ["40,5 kWh", 0, "rend", "Tu as multiplié par 0,90. L'énergie consommée est toujours plus grande que l'énergie utile."], ["45 kWh", 0, "rend", "Ce serait un rendement de 100 %, qui n'existe pas."]] }
    ] } },

{ id: "m4", title: "La pompe à chaleur et le froid", sub: "Déplacer la chaleur au lieu de la créer", dom: ["chal", "elec", "bat"],
  entry: ["Salle serveurs, sous-compteur", ["Cooling", "410 000 kWh"], ["Fluide du groupe froid", "R-410A"]],
  ask: "Comment une machine électrique peut-elle livrer plus de chaleur (ou de froid) qu'elle ne consomme d'électricité ?",
  body: function () { return `
<p>Un radiateur électrique transforme 1 kWh d'électricité en 1 kWh de chaleur. Une <b>pompe à chaleur</b> utilise 1 kWh d'électricité pour aller chercher environ 2 kWh de chaleur dehors (dans l'air, le sol ou l'eau) et livre donc 3 kWh à l'intérieur.</p>
${fig([{ t: "Électricité", s: "30 000 kWh" }, { t: "Pompe", s: "COP 3" }, { t: "Chaleur livrée", s: "90 000 kWh", k: 1 }], { gain: "chaleur prise dans l'air : 60 000 kWh", alt: "Une pompe à chaleur ajoute la chaleur de l'air à l'électricité consommée", cap: "Chaleur livrée = électricité + chaleur prélevée dehors." })}
<p>Le <b>COP</b> (coefficient de performance) est le rapport chaleur livrée ÷ électricité consommée. Un climatiseur ou un groupe froid est la même machine dans l'autre sens : il prend la chaleur de la salle serveurs et la rejette dehors.</p>
<p>Le fluide frigorigène est le transporteur de cette chaleur. C'est lui qui fuit parfois (notion 6).</p>`; },
  pre: [
    ["Dans quel sens va la chaleur ?", "Spontanément, toujours du chaud vers le froid. Pour la faire aller du froid vers le chaud (de l'air d'hiver vers un bureau), il faut fournir un travail : c'est le rôle du compresseur, alimenté en électricité."],
    ["Est-ce contraire à la conservation de l'énergie ?", "Non. La machine ne crée rien : la chaleur livrée est exactement la somme de l'électricité consommée et de la chaleur prélevée dehors."]
  ],
  formula: ["Électricité consommée", "Chaleur livrée ÷ COP"],
  example: `Pour 90 000 kWh de chaleur avec un COP de 3 : 90 000 ÷ 3 = <b>${f(30000)} kWh</b> d'électricité. Les ${f(60000)} kWh restants viennent de l'air extérieur.`,
  limits: ["Le COP baisse quand il fait froid dehors : le COP moyen sur une saison est inférieur au COP du catalogue.", "Les émissions dépendent de l'électricité utilisée, donc du pays (notion 7).", "Une pompe à chaleur contient un fluide frigorigène, qui peut fuir (notion 6).", "L'hiver, beaucoup de pompes à chaleur appellent de la puissance en même temps : c'est un enjeu de pointe pour le réseau."],
  bridges: [["m6", "Le fluide qui transporte la chaleur a un fort pouvoir de réchauffement s'il s'échappe."], ["m7", "L'intérêt climatique d'une pompe à chaleur dépend du mix électrique."], ["m8", "Elle divise les kWh d'énergie finale : un levier direct pour le décret tertiaire."], ["m10", "Investissement élevé, économies annuelles : un cas type de calcul de décision."]],
  proof: {
    explain: { q: "Comment une pompe à chaleur peut-elle fournir 3 kWh de chaleur en consommant 1 kWh d'électricité, sans créer d'énergie ?", model: "Elle ne produit pas la chaleur : elle la déplace. L'électricité fait tourner un compresseur qui prélève de la chaleur dans l'air, le sol ou l'eau, et la transfère à l'intérieur. La chaleur livrée est la somme de l'électricité consommée (1 kWh) et de la chaleur prélevée (2 kWh). Le COP, ici 3, est le rapport chaleur livrée ÷ électricité.",
      keys: ["Elle déplace une chaleur qui existe déjà dehors", "L'électricité sert à faire tourner le compresseur", "Chaleur livrée = électricité + chaleur prélevée", "COP = chaleur livrée ÷ électricité consommée"] },
    apply: [
      { q: "Un groupe froid de data center a une efficacité de 4. Pour évacuer 400 000 kWh de chaleur des serveurs, il consomme environ…", o: [["100 000 kWh d'électricité", 1, "", "400 000 ÷ 4 = 100 000 kWh."], ["1 600 000 kWh", 0, "cop", "Tu as multiplié. La machine consomme moins d'électricité qu'elle ne déplace de chaleur."], ["400 000 kWh", 0, "cop", "Ce serait une efficacité de 1 : celle d'un simple radiateur, pas d'une machine frigorifique."]] },
      { q: "Par grand froid, le COP d'une pompe à chaleur passe de 3,5 à 2. Pour fournir la même chaleur, sa consommation électrique…", o: [["augmente de 75 %", 1, "", "L'électricité varie comme 1 ÷ COP : (1 ÷ 2) ÷ (1 ÷ 3,5) = 1,75."], ["baisse", 0, "cop", "Un COP plus faible veut dire plus d'électricité pour la même chaleur."], ["augmente de 43 %", 0, "pct", "43 % est la baisse du COP. La consommation, elle, varie comme l'inverse du COP."]] }
    ] } },

{ id: "m5", title: "Le facteur d'émission", sub: "De la donnée d'activité aux tonnes de CO₂e", dom: ["clim", "comb", "ener"],
  entry: ["Ce que tu collectes, ce que le bilan affiche", ["Donnée d'activité", "1 200 L de gazole"], ["Dans le bilan GES", "3,72 tCO₂e"]],
  ask: "Par quel calcul passe-t-on de litres à des tonnes de CO₂e ?",
  body: function () { return `
<p>Le bilan de gaz à effet de serre repose sur une multiplication : <b>émissions = donnée d'activité × facteur d'émission</b>. La donnée d'activité est ce que tu collectes (litres, kWh, km, kg). Le facteur d'émission dit combien une unité émet en moyenne.</p>
${fig([{ t: "Activité", s: "1 200 L" }, { t: "× Facteur", s: "3,10 kgCO₂e/L" }, { t: "Émissions", s: "3 720 kgCO₂e", k: 1 }], { alt: "Activité fois facteur d'émission égale émissions" })}
<p>Le « e » de CO₂e signifie <b>équivalent</b> : plusieurs gaz (CO₂, méthane…) sont ramenés à une même unité. Un facteur a aussi un <b>périmètre</b> : la combustion seule (scope 1), ou la combustion plus l'amont, c'est-à-dire l'extraction, le raffinage et le transport du carburant (scope 3). Pour le gazole, la combustion pèse environ 80 % du total.</p>
<table class="tbl"><tr><th>Énergie</th><th>Facteur (amont + combustion)</th></tr>
<tr><td>Gazole</td><td class="mono">${f(R.feGazole, 2)} kgCO₂e/L</td></tr><tr><td>Essence</td><td class="mono">${f(R.feEssence, 2)} kgCO₂e/L</td></tr>
<tr><td>Gaz naturel</td><td class="mono">${f(R.feGazPCS, 3)} kgCO₂e/kWh PCS</td></tr><tr><td>Fioul domestique</td><td class="mono">${f(R.feFioulL, 2)} kgCO₂e/L</td></tr>
<tr><td>Électricité, France</td><td class="mono">${f(R.feElecFR, 3)} kgCO₂e/kWh</td></tr><tr><td>Réseau de chaleur moyen</td><td class="mono">≈ ${f(R.feRCU, 2)} kgCO₂e/kWh</td></tr></table>
<p class="hint">Ordres de grandeur ADEME et Fedene, détaillés dans « Sources et ordres de grandeur ».</p>`; },
  pre: [
    ["Comment 1 litre de gazole (0,84 kg) peut-il émettre plus de 2,5 kg de CO₂ ?", "Parce que le carbone du carburant se combine à l'oxygène de l'air. Un atome de carbone (masse 12) capte deux atomes d'oxygène (masse 16 chacun) : le CO₂ pèse 44, soit 3,67 fois le carbone de départ. L'essentiel de la masse du CO₂ vient de l'air."],
    ["Kilogrammes et tonnes", "1 tonne = 1 000 kg. Un facteur donne en général des kilogrammes de CO₂e. Les bilans s'expriment en tonnes : on divise par 1 000."],
    ["Les trois scopes en deux phrases", "Scope 1 : ce qui brûle ou fuit dans les équipements de l'entreprise. Scope 2 : l'électricité, la chaleur, le froid et la vapeur achetés. Scope 3 : tout le reste de la chaîne de valeur."]
  ],
  formula: ["Émissions (kgCO₂e)", "Donnée d'activité × Facteur d'émission"],
  example: `1 200 L × ${f(R.feGazole, 2)} kgCO₂e/L = <b>${f(1200 * R.feGazole)} kgCO₂e</b>, soit ${f(1200 * R.feGazole / 1000, 2)} tCO₂e.`,
  limits: ["Un facteur d'émission est une moyenne, avec une incertitude. Il dépend du pays, de l'année et du périmètre retenu.", "Les calculs d'UL360 utilisent les facteurs retenus par Worldline, pas ceux de cette appli. Ton rôle porte sur la donnée d'activité.", "Une donnée classée dans le mauvais KPI reçoit le mauvais facteur : l'erreur de classement coûte plus cher que l'erreur de calcul."],
  bridges: [["m2", "Un facteur par litre et un facteur par kWh se déduisent l'un de l'autre grâce au PCI."], ["m6", "Pour les gaz frigorigènes, le facteur s'appelle le PRG."], ["m7", "L'électricité a un facteur différent dans chaque pays."], ["m10", "Le CO₂e évité par une action se calcule avec le même facteur."]],
  proof: {
    explain: { q: "Pourquoi la qualité de la donnée d'activité (bon KPI, bonne unité) compte-t-elle davantage que le calcul lui-même ?", model: "Les émissions s'obtiennent en multipliant la donnée d'activité par un facteur d'émission. Chaque KPI et chaque unité appellent un facteur différent : un kWh de gaz n'émet pas comme un kWh d'électricité. Une donnée mal classée ou dans la mauvaise unité reçoit donc un facteur faux, et le résultat est faux même si la multiplication est juste. Le facteur est par ailleurs une moyenne, avec un périmètre (combustion seule, ou amont compris).",
      keys: ["Émissions = donnée d'activité × facteur d'émission", "Chaque KPI et chaque unité appellent un facteur différent", "Une erreur de classement applique le mauvais facteur", "Le facteur est une moyenne, avec un périmètre"] },
    apply: [
      { q: "Par erreur, 10 000 kWh de gaz (PCS) sont saisis en Normal Grid Electricity, en France. Quel est l'effet sur les émissions calculées ?", o: [["Elles sont sous-estimées, d'environ 4 fois", 1, "", "Gaz : 10 000 × 0,215 = 2 150 kgCO₂e. Électricité française : 10 000 × 0,052 = 520 kgCO₂e."], ["Elles sont surestimées", 0, "fe", "En France, un kWh d'électricité émet environ 4 fois moins qu'un kWh de gaz."], ["Aucun : un kWh reste un kWh", 0, "fe", "Les kWh sont égaux en énergie, pas en émissions : le facteur dépend de l'énergie."]] },
      { q: "Un collègue annonce « 3 100 tCO₂e pour 1 000 L de gazole ». Quel est ton diagnostic ?", o: [["Erreur d'unité : c'est 3,1 tCO₂e", 1, "", "1 000 L × 3,10 = 3 100 kgCO₂e, soit 3,1 tonnes."], ["C'est plausible", 0, "fe", "Repère utile : 1 litre de carburant ≈ 3 kg de CO₂e, donc 1 000 L ≈ 3 tonnes."], ["C'est sous-estimé", 0, "fe", "C'est 1 000 fois trop : des kilogrammes ont été pris pour des tonnes."]] }
    ] } },

{ id: "m6", title: "Les gaz frigorigènes", sub: "Pourquoi quelques kilos pèsent des tonnes", dom: ["clim", "chal"],
  entry: ["Rapport de maintenance HVAC", ["Gaz", "R-410A"], ["Recharge après fuite", "3,5 kg"]],
  ask: "Pourquoi 3,5 kg de gaz comptent-ils pour plus de 7 tonnes dans le bilan ?",
  body: function () { return `
<p>Tous les gaz à effet de serre ne réchauffent pas autant. Le <b>pouvoir de réchauffement global (PRG)</b> compare l'effet d'un kilogramme de gaz à celui d'un kilogramme de CO₂, sur 100 ans.</p>
<table class="tbl"><tr><th>Fluide</th><th>PRG</th><th>1 kg équivaut à</th></tr>
<tr><td>R-410A</td><td class="mono">2 088</td><td>2,1 tCO₂e</td></tr><tr><td>R-134a</td><td class="mono">1 430</td><td>1,4 tCO₂e</td></tr><tr><td>R-32</td><td class="mono">675</td><td>0,7 tCO₂e</td></tr></table>
${fig([{ t: "Fuite", s: "3,5 kg" }, { t: "× PRG", s: "2 088" }, { t: "Émissions", s: "7,3 tCO₂e", k: 1 }], { alt: "Kilogrammes de fluide fois PRG égale émissions" })}
<p>Ces gaz ne brûlent pas. C'est la fuite elle-même qui est l'émission : une émission directe, dite fugitive (scope 1). La quantité rechargée par le technicien sert à mesurer ce qui s'est échappé. D'où l'unité du KPI : des kilogrammes, par type de gaz.</p>`; },
  pre: [
    ["L'effet de serre en deux phrases", "La Terre renvoie vers l'espace une partie de l'énergie du Soleil, sous forme de rayonnement infrarouge. Certains gaz absorbent ce rayonnement et retiennent la chaleur : plus il y en a, plus l'atmosphère se réchauffe."],
    ["Pourquoi le type de gaz est-il indispensable ?", "Parce que le PRG varie du simple au triple entre deux fluides courants. Sans le type, on ne peut pas convertir les kilogrammes en CO₂e."]
  ],
  formula: ["Émissions (kgCO₂e)", "Masse perdue (kg) × PRG"],
  example: `3,5 kg × 2 088 = <b>${f(3.5 * 2088)} kgCO₂e</b>, soit ${f(3.5 * 2088 / 1000, 1)} tCO₂e : autant que la combustion d'environ ${f(3.5 * 2088 / R.feGazole, 0)} L de gazole.`,
  limits: ["Le PRG d'un gaz change d'un rapport du GIEC à l'autre. Vérifie quel référentiel utilise ton bilan (le règlement F-gaz retient le 4ᵉ rapport).", "L'horizon de 100 ans est une convention.", "La recharge est une mesure approchée de la fuite : elle peut couvrir des pertes de plusieurs années."],
  bridges: [["m4", "Ce fluide est celui qui transporte la chaleur dans les groupes froids et les pompes à chaleur."], ["m5", "Même logique que le facteur d'émission : une quantité multipliée par un coefficient."], ["m10", "Le règlement européen F-gaz retire progressivement du marché les fluides à fort PRG : un critère de choix d'équipement."]],
  proof: {
    explain: { q: "Pourquoi une fuite de 3,5 kg de R-410A compte-t-elle pour plus de 7 tonnes de CO₂e ?", model: "Parce que le R-410A réchauffe beaucoup plus que le CO₂ à masse égale. Son pouvoir de réchauffement global est de 2 088 : un kilogramme équivaut à 2 088 kg de CO₂. On multiplie donc la masse perdue par le PRG : 3,5 × 2 088 ≈ 7 300 kgCO₂e. Ce gaz ne brûle pas : c'est sa fuite dans l'atmosphère qui constitue l'émission.",
      keys: ["Le PRG compare l'effet d'un kilogramme de gaz à un kilogramme de CO₂", "Le R-410A a un PRG d'environ 2 088", "Émissions = kilogrammes perdus × PRG", "C'est la fuite qui émet, pas une combustion"] },
    apply: [
      { q: "Deux climatiseurs sont identiques, sauf leur fluide : R-410A ou R-32. À fuite égale en kilogrammes, l'impact climatique du R-32 est…", o: [["environ 3 fois plus faible", 1, "", "2 088 ÷ 675 ≈ 3,1."], ["identique : c'est le même poids", 0, "prg", "À masse égale, deux gaz ne réchauffent pas autant : c'est ce que mesure le PRG."], ["environ 3 fois plus fort", 0, "prg", "Le R-32 a le PRG le plus bas des deux (675 contre 2 088)."]] },
      { q: "Un rapport indique « fuite de R-134a : 2 kg ». En tCO₂e, avec un PRG de 1 430 ?", o: [["2,86 tCO₂e", 1, "", "2 × 1 430 = 2 860 kgCO₂e, soit 2,86 tonnes."], ["0,002 tCO₂e", 0, "prg", "Tu as converti les kilogrammes de gaz en tonnes, sans appliquer le PRG."], ["2 860 tCO₂e", 0, "fe", "2 860 est le résultat en kilogrammes. En tonnes, on divise par 1 000."]] }
    ] } },

{ id: "m7", title: "L'électricité", sub: "Mix, réseau, énergie primaire", dom: ["elec", "clim", "pol"],
  entry: ["Deux factures d'électricité", ["Offre standard", "→ Normal Grid Electricity"], ["Offre avec garanties d'origine", "→ Renewable Electricity"]],
  ask: "Les électrons sont les mêmes. Qu'est-ce qui distingue ces deux kWh, et pourquoi un kWh français n'émet-il pas comme un kWh polonais ?",
  body: function () { return `
<p>L'électricité n'est pas une source d'énergie : c'est un <b>vecteur</b>. On la fabrique à partir d'autre chose (uranium, eau, vent, soleil, gaz, charbon). Son facteur d'émission dépend donc du <b>mix</b> de production du réseau.</p>
<div class="bars" aria-label="Facteur d'émission de l'électricité par zone">
${[["France", R.feElecFR], ["Union européenne", R.feElecUE], ["États-Unis", R.feElecUS], ["Monde", R.feElecMonde]].map(function (x) { return '<div class="bar"><span>' + x[0] + '</span><i style="width:' + Math.max(3, Math.round(x[1] / R.feElecMonde * 100)) + '%"></i><b>' + f(x[1], 3) + '</b></div>'; }).join("")}
</div><p class="hint">En kgCO₂e par kWh. France : ADEME. Autres zones : Ember, 2025.</p>
<p><b>Deux façons de compter.</b> Sur le réseau, on ne peut pas suivre un électron. La méthode <i>location-based</i> applique le mix moyen du réseau où l'on consomme. La méthode <i>market-based</i> tient compte des contrats : une garantie d'origine atteste qu'un MWh renouvelable a été injecté quelque part. D'où les deux KPI, et l'exigence d'un justificatif.</p>
<p><b>Énergie finale et énergie primaire.</b> L'énergie finale est celle du compteur. L'énergie primaire est la ressource qu'il a fallu mobiliser en amont, pertes de production et de transport comprises. On passe de l'une à l'autre par un coefficient conventionnel : 1,9 pour l'électricité dans le DPE depuis le 1ᵉʳ janvier 2026 (2,3 auparavant), 1 pour le gaz.</p>`; },
  pre: [
    ["Pourquoi le réseau doit-il être équilibré à chaque instant ?", "L'électricité se stocke mal à grande échelle. Il faut produire à chaque seconde ce qui est consommé. C'est pourquoi la pointe de puissance (un soir d'hiver) compte autant que le total annuel."],
    ["Qu'est-ce qu'une garantie d'origine ?", "Un certificat électronique qui atteste qu'un MWh d'électricité renouvelable a été produit et injecté sur le réseau. Le fournisseur l'annule au nom de son client. C'est la pièce qui permet de qualifier une consommation de renouvelable."]
  ],
  formula: ["Énergie primaire", "Énergie finale × Coefficient"],
  example: `245 000 kWh en France : 245 000 × ${f(R.feElecFR, 3)} = <b>${f(245000 * R.feElecFR / 1000, 1)} tCO₂e</b>. Avec le mix moyen mondial, ce serait ${f(245000 * R.feElecMonde / 1000, 0)} tCO₂e. En énergie primaire : 245 000 × 1,9 = ${f(245000 * 1.9)} kWh.`,
  limits: ["Le facteur moyen annuel masque de fortes variations selon l'heure et la saison.", "Le coefficient d'énergie primaire est une convention réglementaire, pas une constante physique : il est passé de 2,58 à 2,3, puis à 1,9.", "Les sources ne comptent pas la même chose : pour la France, l'ADEME donne 0,052 et Ember 0,041. Ne mélange pas deux sources dans une même comparaison sans le signaler."],
  bridges: [["m4", "Électrifier le chauffage n'a d'intérêt climatique que si l'électricité est peu carbonée."], ["m9", "Même raisonnement pour la voiture électrique."], ["m8", "Le décret tertiaire compte en énergie finale, le DPE en énergie primaire : deux lectures du même bâtiment."], ["m1", "L'équilibre du réseau est une affaire de puissance, pas seulement d'énergie."]],
  proof: {
    explain: { q: "Pourquoi la même consommation d'électricité n'a-t-elle pas la même empreinte carbone en France et dans un pays où l'électricité vient surtout du charbon ?", model: "L'électricité est un vecteur : elle est produite à partir d'autres énergies. Son facteur d'émission dépend donc du mix de production du réseau. En France, le nucléaire et l'hydraulique dominent, et le facteur est faible (environ 0,05 kgCO₂e/kWh). Avec du charbon ou du gaz, il est plusieurs fois plus élevé. En méthode location-based, on applique le mix moyen du réseau où l'on consomme.",
      keys: ["L'électricité est un vecteur, produit à partir d'autres énergies", "Le facteur d'émission dépend du mix de production du réseau", "Mix français peu carboné, mix au charbon ou au gaz très carboné", "On applique le mix du réseau où l'on consomme (location-based)"] },
    apply: [
      { q: "Une charge de serveurs de 1 000 000 kWh par an est déplacée d'un pays à 0,40 kgCO₂e/kWh vers la France (0,052). Quelles émissions location-based sont évitées chaque année ?", o: [["Environ 348 tCO₂e", 1, "", "1 000 000 × (0,40 − 0,052) = 348 000 kgCO₂e."], ["Environ 52 tCO₂e", 0, "mix", "52 t est ce qui reste émis en France. L'évitement est la différence entre les deux pays."], ["Aucune : la consommation est la même", 0, "mix", "L'énergie est la même, mais pas le mix qui la produit."]] },
      { q: "Un bâtiment tout électrique consomme 100 000 kWh au compteur. Avec le coefficient 1,9, son énergie primaire est de…", o: [["190 000 kWh", 1, "", "Énergie primaire = énergie finale × 1,9."], ["Environ 52 600 kWh", 0, "mix", "Tu as divisé. L'énergie primaire est toujours la plus grande : elle inclut les pertes en amont."], ["100 000 kWh", 0, "mix", "Ce serait vrai pour le gaz (coefficient 1), pas pour l'électricité."]] }
    ] } },

{ id: "m8", title: "Le bâtiment", sub: "kWh/m², année de référence, décret tertiaire", dom: ["bat", "pol", "ener"],
  entry: ["Fiche d'un immeuble de bureaux", ["Surface", "6 000 m²"], ["Consommation de référence", "1 200 000 kWh"]],
  ask: "Ce bâtiment consomme-t-il beaucoup, et que doit-il atteindre en 2030 ?",
  body: function () { return `
<p>Un bâtiment consomme pour se chauffer, se refroidir, se ventiler, s'éclairer et alimenter ses équipements. Pour comparer deux bâtiments de tailles différentes, on calcule une <b>intensité</b> : les kWh divisés par la surface.</p>
<p>Le dispositif <b>Éco Énergie Tertiaire</b> (le « décret tertiaire ») vise les bâtiments tertiaires d'au moins 1 000 m². Il porte sur l'énergie finale, tous usages confondus, et impose une baisse par rapport à une année de référence choisie entre 2010 et 2019.</p>
<div class="bars">
${[["Référence", 100, ""], ["2030 : −40 %", 60, "pos"], ["2040 : −50 %", 50, "pos"], ["2050 : −60 %", 40, "pos"]].map(function (x) { return '<div class="bar ' + x[2] + '"><span>' + x[0] + '</span><i style="width:' + x[1] + '%"></i><b>' + f(12000 * x[1]) + '</b></div>'; }).join("")}
</div><p class="hint">En kWh, pour une référence de 1 200 000 kWh. Une autre voie existe : atteindre un seuil en valeur absolue, fixé par type d'activité. Les consommations se déclarent chaque année sur la plateforme OPERAT.</p>`; },
  pre: [
    ["Réduire de 40 %, c'est multiplier par combien ?", "Par 0,6. On garde 100 % − 40 % = 60 % de la valeur de départ. Réduire de 60 %, c'est multiplier par 0,4."],
    ["Qu'est-ce qu'un degré-jour (DJU) ?", "Une mesure de la rigueur de l'hiver. Chaque jour, on compte l'écart entre une température de référence (souvent 18 °C) et la température extérieure, puis on additionne sur la saison. Plus il y a de degrés-jours, plus il a fallu chauffer. Cela permet de comparer deux années à climat égal."]
  ],
  formula: ["Objectif 2030", "Référence × (1 − 0,40)"],
  example: `Intensité de référence : 1 200 000 ÷ 6 000 = <b>${f(200)} kWh/m²</b>. Objectif 2030 : 1 200 000 × 0,6 = <b>${f(720000)} kWh</b>.`,
  limits: ["Comparer deux années sans correction climatique peut tromper : un hiver doux fait baisser la consommation sans aucune action.", "Les kWh/m² dépendent de l'activité et de l'occupation : un data center et un bureau ne se comparent pas.", "L'objectif porte sur l'énergie finale : remplacer une chaudière par une pompe à chaleur réduit fortement ces kWh, sans que le besoin de chaleur ait changé.", "Additionner électricité et gaz suppose des kWh homogènes (attention au PCS et au PCI)."],
  bridges: [["m4", "La pompe à chaleur divise l'énergie finale du chauffage par son COP."], ["m7", "Énergie finale pour le décret tertiaire, énergie primaire pour le DPE."], ["m10", "L'obligation réglementaire change le calcul économique d'une rénovation."], ["m1", "L'intensité se calcule sur l'énergie annuelle, pas sur la puissance installée."]],
  proof: {
    explain: { q: "Explique l'objectif 2030 du décret tertiaire pour un bâtiment dont la consommation de référence est connue, et donne une limite de cet indicateur.", model: "Le dispositif concerne les bâtiments tertiaires d'au moins 1 000 m² et porte sur leur énergie finale. En 2030, la consommation doit avoir baissé de 40 % par rapport à une année de référence choisie entre 2010 et 2019 : on multiplie la référence par 0,6. Viennent ensuite −50 % en 2040 et −60 % en 2050, ou bien un seuil en valeur absolue. Limite : la consommation dépend du climat, de l'activité et de l'occupation, d'où la nécessité de corrections pour comparer.",
      keys: ["Bâtiments tertiaires d'au moins 1 000 m², en énergie finale", "−40 % en 2030 par rapport à une année de référence : × 0,6", "Puis −50 % en 2040 et −60 % en 2050, ou un seuil en valeur absolue", "Limite : climat, activité, occupation faussent la comparaison"] },
    apply: [
      { q: "Un site était à 250 kWh/m² l'année de référence. Il est aujourd'hui à 175 kWh/m². A-t-il atteint l'équivalent de l'objectif 2030 ?", o: [["Non : il est à −30 %, la cible est 150 kWh/m²", 1, "", "250 × 0,6 = 150 kWh/m². À 175, la baisse est de 75 ÷ 250 = 30 %."], ["Oui, il a baissé de plus de 40 %", 0, "pct", "La baisse est de 75 sur 250, soit 30 %."], ["Impossible à dire sans la surface", 0, "pct", "L'intensité est déjà rapportée à la surface : le pourcentage se calcule directement."]] },
      { q: "Après un hiver doux en 2023 puis rigoureux en 2024, la consommation de chauffage d'un bâtiment augmente de 8 %. Peut-on conclure qu'il s'est dégradé ?", o: [["Non, pas sans correction climatique", 1, "", "Il faut comparer à climat égal, avec les degrés-jours, avant de conclure."], ["Oui, de 8 % exactement", 0, "pct", "Une partie de la hausse, peut-être toute, vient de la rigueur de l'hiver."], ["Oui : la consommation ne dépend que du bâtiment", 0, "pct", "Le chauffage dépend d'abord de la température extérieure."]] }
    ] } },

{ id: "m9", title: "Le transport", sub: "Du kilomètre au litre, du litre au CO₂e", dom: ["trans", "comb", "clim"],
  entry: ["Rapport de flotte, un véhicule diesel", ["Distance annuelle", "15 000 km"], ["Consommation moyenne", "6,5 L/100 km"]],
  ask: "Combien de litres, combien de CO₂e, et que change un véhicule électrique ?",
  body: function () { return `
<p>Deux données permettent d'estimer les émissions d'un véhicule : le carburant réellement consommé (le plus fiable), ou la distance multipliée par une consommation moyenne. D'où les trois KPI de la flotte : litres, kWh et kilomètres.</p>
${fig([{ t: "Distance", s: "15 000 km" }, { t: "× Conso", s: "6,5 L/100 km" }, { t: "Carburant", s: "975 L", k: 1 }], { alt: "Kilomètres fois consommation égale litres", cap: "Puis 975 L × 3,10 = 3 022 kgCO₂e, soit environ 200 g par kilomètre." })}
<p><b>Pourquoi l'électrique consomme moins.</b> Un moteur thermique transforme 25 à 40 % de l'énergie du carburant en mouvement : le reste part en chaleur. Un moteur électrique dépasse 90 %. Pour 100 km, un diesel brûle environ 6,5 L, soit 65 kWh. Une voiture électrique consomme environ 17 kWh.</p>
<p><b>Dans quel scope ?</b> Le carburant des véhicules de l'entreprise relève du scope 1, leur électricité du scope 2. Les déplacements professionnels dans des véhicules que l'entreprise ne possède pas (train, avion, voiture de location) relèvent du scope 3, catégorie 6.</p>`; },
  pre: [
    ["Lire « 6,5 L/100 km »", "Cela veut dire 6,5 litres pour 100 kilomètres, soit 0,065 litre par kilomètre. Pour une distance donnée : litres = kilomètres × 6,5 ÷ 100."],
    ["Les grammes par kilomètre", "On divise les émissions par la distance : 3 022 kgCO₂e ÷ 15 000 km ≈ 0,2 kg, soit 200 g par kilomètre."]
  ],
  formula: ["Émissions (kgCO₂e)", "km × (L/100 km) ÷ 100 × Facteur"],
  example: `Diesel : 15 000 × 6,5 ÷ 100 = ${f(975)} L, puis × ${f(R.feGazole, 2)} = <b>${f(975 * R.feGazole)} kgCO₂e</b>. Électrique en France : 15 000 × 17 ÷ 100 = ${f(2550)} kWh, puis × ${f(R.feElecFR, 3)} = <b>${f(2550 * R.feElecFR)} kgCO₂e</b>.`,
  limits: ["Ce calcul ne couvre que l'usage. La fabrication du véhicule et de sa batterie relève d'une analyse de cycle de vie.", "La consommation réelle dépasse souvent la consommation homologuée.", "Pour un hybride rechargeable, tout dépend de la fréquence réelle des recharges.", "Pour l'avion, certaines méthodes ajoutent les effets hors CO₂ (traînées de condensation), d'autres non : vérifie la méthode."],
  bridges: [["m2", "Les litres se convertissent en kWh grâce au PCI : c'est ce qui permet de comparer thermique et électrique."], ["m3", "L'écart de consommation vient du rendement des moteurs."], ["m7", "Le bilan d'un véhicule électrique dépend du mix du pays où il se recharge."], ["m5", "Litres ou kWh multipliés par un facteur d'émission : toujours la même logique."]],
  proof: {
    explain: { q: "Pourquoi une voiture électrique consomme-t-elle environ quatre fois moins d'énergie qu'une voiture diesel pour la même distance ?", model: "Parce que les deux moteurs n'ont pas le même rendement. Un moteur thermique ne transforme que 25 à 40 % de l'énergie du carburant en mouvement : le reste est dissipé en chaleur. Un moteur électrique dépasse 90 %. Pour 100 km, on compte environ 65 kWh de gazole contre 17 kWh d'électricité. Les émissions dépendent ensuite du mix électrique du pays.",
      keys: ["Le moteur thermique dissipe l'essentiel de l'énergie en chaleur (rendement 25 à 40 %)", "Le moteur électrique a un rendement supérieur à 90 %", "Environ 65 kWh de gazole contre 17 kWh d'électricité aux 100 km", "Les émissions dépendent ensuite du mix électrique"] },
    apply: [
      { q: "Tu ne connais que la distance d'une flotte diesel, 318 000 km, et sa consommation moyenne, 6 L/100 km. Combien de litres estimes-tu ?", o: [["19 080 L", 1, "", "318 000 × 6 ÷ 100 = 19 080 L."], ["1 908 000 L", 0, "veh", "Il manque la division par 100 : 6 litres valent pour 100 km, pas pour 1 km."], ["53 000 L", 0, "veh", "Tu as divisé la distance par 6. Il faut multiplier par 6, puis diviser par 100."]] },
      { q: "Un salarié loue une voiture pour un déplacement professionnel. Dans le bilan GES de l'entreprise, ces émissions relèvent…", o: [["du scope 3, catégorie 6", 1, "", "Le véhicule n'appartient pas à l'entreprise : ce sont des déplacements professionnels."], ["du scope 1, comme la flotte", 0, "scope", "Le scope 1 couvre les véhicules que l'entreprise possède ou contrôle."], ["du scope 2", 0, "scope", "Le scope 2 couvre l'électricité, la chaleur, le froid et la vapeur achetés."]] }
    ] } },

{ id: "m10", title: "Décider", sub: "Temps de retour, CO₂e évité, coût de la tonne", dom: ["eco", "pol", "clim"],
  entry: ["Projet de rénovation d'une chaufferie", ["Investissement", "120 000 €"], ["Gaz économisé", "150 000 kWh par an"]],
  ask: "Est-ce une bonne décision ? Avec quels indicateurs la comparer à une autre action ?",
  body: function () { return `
<p>Pour juger une action, on pose trois questions. Combien d'énergie économise-t-elle (kWh par an) ? Combien d'euros (kWh × prix) ? Combien de CO₂e (kWh × facteur d'émission) ?</p>
<p>Deux indicateurs permettent ensuite de comparer des actions entre elles :</p>
<ul><li>le <b>temps de retour</b> : l'investissement divisé par l'économie annuelle en euros ;</li>
<li>le <b>coût de la tonne évitée</b> : le coût net sur la durée de vie, divisé par les tonnes de CO₂e évitées. S'il est négatif, l'action rapporte de l'argent en plus de réduire les émissions.</li></ul>
<p><b>Le rôle des politiques publiques.</b> Un prix du carbone renchérit l'énergie fossile et raccourcit le temps de retour. Une aide réduit l'investissement. Une obligation, comme le décret tertiaire, rend l'action nécessaire quel que soit son temps de retour. Le même calcul physique donne donc des décisions différentes selon le cadre juridique.</p>`; },
  pre: [
    ["Pourquoi un coût peut-il être négatif ?", "Si les économies d'énergie cumulées dépassent l'investissement, l'action coûte moins que de ne rien faire. Le coût net est alors négatif, et le coût par tonne évitée aussi."],
    ["Durée de vie et cumul", "Une action produit ses effets chaque année. On multiplie l'économie annuelle par la durée de vie de l'équipement pour obtenir le total."]
  ],
  formula: ["Temps de retour (ans)", "Investissement ÷ Économie annuelle (€)"],
  example: `Économie : 150 000 kWh × 0,09 € = ${f(13500)} € par an. Temps de retour : 120 000 ÷ 13 500 = <b>${f(120000 / 13500, 1)} ans</b>. CO₂e évité : 150 000 × ${f(R.feGazPCS, 3)} = ${f(150000 * R.feGazPCS / 1000, 1)} t par an, soit ${f(150000 * R.feGazPCS / 1000 * 15, 0)} t en 15 ans. Coût net : 120 000 − 15 × 13 500 = −82 500 €, soit <b>${f(-82500 / (150000 * R.feGazPCS / 1000 * 15), 0)} € par tonne évitée</b>.`,
  limits: ["Ce calcul simple ignore l'actualisation (un euro dans dix ans vaut moins qu'un euro aujourd'hui) et l'évolution des prix.", "Les économies prévues sont souvent supérieures aux économies mesurées, notamment à cause de l'effet rebond.", "Le facteur d'émission de l'énergie évitée évolue dans le temps.", "Le coût par tonne ne dit rien des autres bénéfices : confort, conformité, valeur du bâtiment."],
  bridges: [["m5", "Le CO₂e évité se calcule avec le facteur de l'énergie que l'on ne consomme plus."], ["m7", "Économiser un kWh d'électricité française évite quatre fois moins de CO₂e qu'un kWh de gaz."], ["m8", "L'échéance de 2030 transforme une action rentable ou non en action obligatoire."], ["m4", "La pompe à chaleur est l'exemple type : investissement fort, gain en énergie et en CO₂e."]],
  proof: {
    explain: { q: "Deux actions économisent chacune 100 000 kWh par an : l'une sur le gaz, l'autre sur l'électricité française. Laquelle évite le plus de CO₂e, et pourquoi cela ne suffit-il pas pour décider ?", model: "Le CO₂e évité est le produit des kWh économisés par le facteur d'émission de l'énergie concernée. Le gaz émet environ 0,215 kgCO₂e/kWh, l'électricité française environ 0,052 : l'action sur le gaz évite donc environ quatre fois plus. Mais décider demande aussi de regarder le coût (temps de retour, euros par tonne évitée) et les contraintes : l'objectif du décret tertiaire en énergie finale, les prix, la durée de vie des équipements.",
      keys: ["CO₂e évité = kWh économisés × facteur d'émission", "Le gaz évite environ 4 fois plus que l'électricité française", "Il faut aussi le coût : temps de retour, euros par tonne évitée", "Et les contraintes : obligation en énergie finale, prix, durée de vie"] },
    apply: [

  var b = pick([45000, 72000, 90000, 180000]), e = pick([75, 80, 90]);
  return num(`Un bâtiment a besoin de ${f(b)} kWh de chaleur utile. Sa chaudière a un rendement de ${e} %. Combien d'énergie faut-il acheter ?`, b / (e / 100), "kWh",

m4: function () { var b = pick([60000, 90000, 120000, 240000]), c = pick([2.5, 3, 4]);

m5: function () { var e = pick([["de gazole", "L", R.feGazole, [1200, 2500, 4000]], ["de gaz naturel", "kWh PCS", R.feGazPCS, [84300, 120000]], ["d'électricité (France)", "kWh", R.feElecFR, [245000, 410000]], ["d'essence", "L", R.feEssence, [1500, 3400]]]), q = pick(e[3]);

    ["Émissions = donnée d'activité × facteur d'émission.", `${f(q)} × ${f(e[2], 3)} = ${f(q * e[2], 0)} kgCO₂e.`, `En tonnes : ÷ 1 000 = ${f(q * e[2] / 1000, 2)} tCO₂e.`],

m6: function () { var g = pick([["R-410A", 2088], ["R-134a", 1430], ["R-32", 675]]), k = pick([1.2, 2, 3.5, 8, 12]);
  return num(`Un équipement a perdu ${f(k)} kg de ${g[0]} (PRG ${f(g[1])}). Quelles sont les émissions en tonnes de CO₂e ?`, k * g[1] / 1000, "tCO₂e",
    ["Émissions = masse perdue × PRG.", `${f(k)} × ${f(g[1])} = ${f(k * g[1], 0)} kgCO₂e.`, `En tonnes : ${f(k * g[1] / 1000, 2)} tCO₂e.`],

m7: function () {

m8: function () {

      [`Prends une référence de 100. Aujourd'hui : ${100 - d}. Cible : 60.`, `Baisse restante : (${100 - d} − 60) ÷ ${100 - d} = ${f(rest, 1)} %.`],

  var ref = pick([800000, 1200000, 2500000, 640000]), y = pick([[2030, 0.4], [2050, 0.6]]);
  return num(`La consommation de référence d'un bâtiment est de ${f(ref)} kWh. Quelle est sa cible ${y[0]} (−${y[1] * 100} %) ?`, ref * (1 - y[1]), "kWh",

m9: function () { var km = pick([12000, 15000, 25000, 40000]), c = pick([5, 6, 6.5, 8]), L = km * c / 100;
