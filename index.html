  example: `600 k€ de conseil informatique × 75 kgCO₂e/k€ = ${f(600 * 75)} kgCO₂e, soit <b>${f(600 * 75 / 1000)} tCO₂e</b>. La même somme en produits métalliques pèserait 600 × 317 = <b>${f(600 * R.ratio.metal / 1000, 0)} tCO₂e</b>, soit environ quatre fois plus.`,
  limits: ["Un ratio est une moyenne de secteur : il ne distingue pas un fournisseur sobre d'un fournisseur très émetteur.", "Le calcul suit les prix : si un fournisseur augmente ses tarifs, les émissions calculées montent sans que rien n'ait changé physiquement.", "Négocier un prix plus bas fait baisser le résultat, pas les émissions réelles.", "Les ratios sont mis à jour : ceux de l'ADEME ont été remplacés en 2025. Deux années calculées avec deux jeux de ratios ne se comparent pas directement."],
  bridges: [["m5", "Même structure que le facteur d'émission : seule la donnée d'activité change, des euros au lieu de litres."], ["m13", "Avant d'expliquer une hausse, il faut séparer ce qui vient des dépenses et ce qui vient du ratio."], ["m10", "Le coût par tonne évitée sert aussi à comparer des actions sur les achats."]],
  proof: {
    explain: { q: "Explique la méthode par les dépenses à un acheteur, avec ses deux principales limites.", model: "On multiplie le montant hors taxes d'un achat, en milliers d'euros, par un ratio monétaire : les émissions moyennes du secteur pour mille euros. Par exemple, 600 k€ de conseil informatique à 75 kgCO₂e/k€ donnent 45 tCO₂e. Première limite : c'est une moyenne, qui ne distingue pas un bon fournisseur d'un mauvais. Deuxième limite : le résultat suit les prix, donc l'inflation ou une négociation le font bouger sans changement physique. La méthode sert à repérer les gros postes, pas à mesurer finement.",
      keys: ["Montant HT en k€ × ratio monétaire du secteur", "Un exemple chiffré correct", "Limite : une moyenne, aveugle au fournisseur réel", "Limite : le résultat suit les prix, pas la physique"] },
    apply: [
      { q: "Deux fournisseurs réalisent la même prestation de conseil informatique. Le premier facture 100 k€, le second 80 k€. Par la méthode des dépenses, lequel « émet » le moins ?", o: [["Le second, mais seulement parce qu'il est moins cher", 1, "", "80 × 75 = 6 t, contre 7,5 t. Le calcul suit le prix : il ne dit rien des émissions réelles de chacun."], ["Le second : il est donc plus vertueux", 0, "spend", "Le ratio est le même pour les deux. L'écart vient du seul prix, pas d'une meilleure performance."], ["Aucun : le calcul donne le même résultat pour une prestation identique", 0, "spend", "Physiquement, peut-être. Mais la méthode par les dépenses donne deux résultats différents : c'est sa limite."]] },
      { q: "Une entreprise achète pour 2 000 k€ de serveurs, amortis sur 5 ans en comptabilité. Selon le GHG Protocol, quelle part de leurs émissions de fabrication entre dans le bilan de l'année d'achat ?", o: [["100 %, en catégorie 2", 1, "", "Le GHG Protocol compte les immobilisations en totalité l'année de l'acquisition, sans amortissement."], ["20 %, comme l'amortissement comptable", 0, "s3cat", "C'est la logique comptable, et celle de la méthode Bilan Carbone. Le GHG Protocol, lui, n'étale pas."], ["100 %, en catégorie 1", 0, "s3cat", "Un bien durable inscrit à l'actif est une immobilisation : catégorie 2."]] }
    ] } },

{ id: "m13", track: "s3", title: "Lire une variation", sub: "Volume, prix, facteur : d'où vient l'écart ?", dom: ["achats", "eco", "compta"],
  entry: ["Comparaison de deux années", ["Achats de télécommunications, année 1", "1 020 tCO₂e"], ["Achats de télécommunications, année 2", "1 088 tCO₂e"]],
  ask: "Les émissions montent de 68 t. A-t-on acheté plus, payé plus cher, ou est-ce le ratio qui a changé ?",
  body: function () { return `
<p>Une émission calculée est le produit de deux nombres : une <b>donnée d'activité</b> et un <b>facteur</b>. Quand le résultat bouge, l'un des deux a bougé, ou les deux. Avant de commenter une hausse, on la décompose.</p>
<p>Ici, les dépenses sont passées de 6 000 à 8 000 k€, et le ratio de 170 à 136 kgCO₂e/k€ après une mise à jour de la base de facteurs.</p>
${fig([{ t: "Volume", s: "+340 t" }, { t: "+ Facteur", s: "−272 t" }, { t: "Écart", s: "+68 t", k: 1 }], { alt: "Effet volume plus effet facteur égale écart", cap: "Une forte hausse des dépenses est presque effacée par la baisse du ratio. Le chiffre final cache les deux mouvements." })}
<p><b>L'effet volume</b> est l'écart qu'on aurait eu si le ratio n'avait pas changé : (dépense de l'année 2 − dépense de l'année 1) × ratio de l'année 1.</p>
<p><b>L'effet facteur</b> est ce que le changement de ratio produit sur les dépenses de l'année 2 : dépense de l'année 2 × (ratio de l'année 2 − ratio de l'année 1).</p>
<p>Dans l'effet volume, il reste à distinguer trois choses : des quantités réellement achetées en plus, des <b>prix</b> plus élevés, ou un <b>reclassement</b>. Une dépense qui change de code d'achat change de ratio : elle disparaît d'une famille et apparaît dans une autre, sans qu'aucun achat n'ait changé.</p>
<table class="tbl"><tr><th>Donnée utilisée</th><th>Ce qu'elle voit</th></tr>
<tr><td>Dépenses × ratio monétaire</td><td>Les montants. Aveugle au fournisseur et sensible aux prix.</td></tr>
<tr><td>Quantités × facteur moyen</td><td>Les volumes physiques. Insensible aux prix.</td></tr>
<tr><td>Données du fournisseur</td><td>Ses émissions réelles. La plus fidèle, la plus coûteuse à obtenir.</td></tr></table>`; },
  pre: [
    ["Pourquoi un ratio change-t-il d'une année à l'autre ?", "Parce que la base de facteurs est mise à jour : nouvelles statistiques, nouvelle année de référence pour les euros, nouvelle méthode. L'ADEME a remplacé ses ratios monétaires en 2025 ; celui des télécommunications est ainsi passé de 170 à 136 kgCO₂e/k€. Le monde réel n'a pas changé ce jour-là : c'est l'instrument de mesure qui a changé."],
    ["Recalculer les années passées", "Quand la méthode ou les facteurs changent de façon significative, le GHG Protocol demande de recalculer les années de comparaison avec la nouvelle méthode. C'est ce que fait un rapport lorsqu'il « retraite » un chiffre déjà publié. Le rapport 2025 de Worldline a ainsi retraité les déplacements professionnels de 2024, de 1 409 à 2 454 t."],
    ["Euros constants : retirer l'inflation", "Si les prix ont monté de 5 %, une dépense de 105 achète ce que 100 achetait avant. Pour comparer des volumes, on divise la dépense de l'année par 1,05. On parle alors d'euros constants."]
  ],
  formula: ["Écart d'émissions", "Effet volume + Effet facteur"],
  example: `Effet volume : (8 000 − 6 000) × 170 = <b>+${f(2000 * 170 / 1000)} t</b>. Effet facteur : 8 000 × (136 − 170) = <b>${f(8000 * (136 - 170) / 1000)} t</b>. Écart : <b>+${f((8000 * 136 - 6000 * 170) / 1000)} t</b>, soit 1 088 − 1 020.`,
  limits: ["Il existe plusieurs conventions de décomposition. Celle-ci attribue le changement de ratio aux dépenses de la dernière année ; d'autres répartissent un peu autrement, pour le même total.", "L'effet volume mélange encore les quantités réelles et les prix : il faut des euros constants pour les séparer.", "Un reclassement de code d'achat ressemble à une variation, alors que rien n'a été acheté en plus ou en moins.", "Avec une incertitude de l'ordre de 80 % sur un ratio, un écart de quelques pour cent n'est pas une tendance."],
  bridges: [["m12", "La décomposition part du calcul par les dépenses : dépense × ratio."], ["m8", "Comme pour le décret tertiaire, tout dépend de la base à laquelle on compare."], ["m10", "Décider d'une action suppose de savoir si la baisse observée est réelle."]],
  proof: {
    explain: { q: "Un responsable te demande pourquoi les émissions d'achats ont augmenté. Explique comment tu procèdes avant de conclure.", model: "Je décompose l'écart. Une émission calculée est une dépense multipliée par un ratio : je regarde donc d'abord si le ratio a changé entre les deux périodes, puis si les dépenses ont changé. L'effet volume est l'écart de dépenses multiplié par l'ancien ratio ; l'effet facteur est le changement de ratio appliqué aux dépenses de l'année. Dans l'effet volume, je vérifie ensuite ce qui vient des prix et ce qui vient d'un reclassement de code d'achat. Je ne parle de hausse réelle qu'après ces vérifications.",
      keys: ["Une émission calculée = donnée d'activité × facteur", "Séparer l'effet volume et l'effet facteur", "Dans le volume : distinguer quantités, prix et reclassements", "Ne conclure à une hausse réelle qu'après ces contrôles"] },
    apply: [
      { q: "Les dépenses d'une famille restent à 1 000 k€, mais le ratio passe de 170 à 136 kgCO₂e/k€ après une mise à jour de la base. Les émissions calculées baissent de 34 t. Que peut-on annoncer ?", o: [["Rien sur le réel : c'est un effet de facteur", 1, "", "1 000 × (136 − 170) = −34 t, sans aucun changement d'achat. Il faut recalculer l'année précédente avec le nouveau ratio pour comparer."], ["Une baisse de 20 % des émissions d'achats", 0, "s3var", "Le chiffre baisse de 20 %, mais les achats sont identiques. Seul l'instrument de mesure a changé."], ["Une hausse cachée des volumes", 0, "s3var", "Les dépenses sont stables : il n'y a pas d'effet volume ici."]] },
      { q: "Une ligne « maintenance de logiciels » passe du code « télécommunications » (136 kgCO₂e/k€) au code « conseil informatique » (75 kgCO₂e/k€). La dépense reste de 500 k€. L'écart d'émissions est de…", o: [["−30,5 t, dû au seul reclassement", 1, "", "500 × (75 − 136) = −30 500 kgCO₂e. Aucune prestation n'a changé : seule l'étiquette a changé."], ["0 t : la dépense est la même", 0, "s3var", "La dépense est la même, mais pas le ratio appliqué : le résultat change."], ["−61 t", 0, "spend", "61 est l'écart entre les deux ratios, en kg par millier d'euros. Il faut le multiplier par 500 k€, puis passer en tonnes."]] }
    ] } },

{ id: "m14", track: "s3", title: "L'amont de l'énergie", sub: "Catégorie 3 : ce que le litre a émis avant d'arriver", dom: ["comb", "elec", "compta"],
  entry: ["Bon de livraison, diesel", ["Quantité livrée", "1 800 L"], ["Facteur complet de l'ADEME", "3,10 kgCO₂e/L"]],
  ask: "Brûler un litre de gazole émet 2,49 kg de CO₂e. D'où viennent les 0,61 kg restants, et où les range-t-on ?",
  body: function () { return `
<p>Avant d'être brûlé dans le groupe électrogène, le gazole a été extrait, raffiné et transporté. Chaque étape a émis des gaz à effet de serre. C'est <b>l'amont</b> du combustible.</p>
${fig([{ t: "Amont", s: "0,61 kg/L" }, { t: "Combustion", s: "2,49 kg/L" }, { t: "Total", s: "3,10 kg/L", k: 1 }], { alt: "Amont plus combustion égale facteur complet", cap: "L'amont va en scope 3, catégorie 3. La combustion va en scope 1. Le facteur complet de l'ADEME additionne les deux." })}
<p>La même logique vaut pour toutes les énergies des scopes 1 et 2 :</p>
<ul><li><b>Combustibles</b> : extraction, raffinage et transport vont en catégorie 3.</li>
<li><b>Électricité</b> : l'amont des combustibles des centrales et la construction des installations vont en catégorie 3, ainsi que les <b>pertes en ligne</b>, c'est-à-dire l'électricité dissipée dans les câbles entre la centrale et le compteur.</li></ul>
<p>Pour l'électricité française de 2023, l'ADEME distingue 0,039 kgCO₂e/kWh pour la combustion en centrale, 0,013 pour l'amont, et une part pour le transport et la distribution. Le repère de 0,052 utilisé dans la notion 7 est, lui, un facteur complet, toutes parts comprises. Au sens strict du GHG Protocol, seule la production en centrale relève du scope 2 : l'amont et les pertes vont en catégorie 3.</p>
<p>Conséquence pratique : un même volume de gazole apparaît deux fois dans le bilan, avec deux facteurs, dans deux scopes. Ce n'est pas un double compte : les deux morceaux se complètent.</p>
<p>Chez Worldline, la catégorie 3 pèse 3 188 t en 2025. D'après le rapport, elle se calcule à partir des consommations des scopes 1 et 2, multipliées par des facteurs d'amont propres à chaque pays, issus d'UL360.</p>`; },
  pre: [
    ["Pourquoi séparer amont et combustion ?", "Parce que les scopes suivent le lieu de l'émission. La combustion a lieu dans l'équipement de l'entreprise : scope 1. L'extraction et le raffinage ont lieu chez le pétrolier : scope 3. Un seul facteur « tout compris » mélangerait deux périmètres."],
    ["Que sont les pertes en ligne ?", "Une partie de l'électricité injectée sur le réseau se dissipe en chaleur dans les câbles et les transformateurs. Pour livrer 100 kWh au compteur, les centrales doivent en produire un peu plus. Les émissions de ce supplément sont comptées par le consommateur en scope 3, catégorie 3."],
    ["Et l'électricité renouvelable avec garanties d'origine ?", "En market-based, son scope 2 peut être nul. Mais fabriquer les panneaux ou les éoliennes a émis, et les pertes en ligne existent toujours : une part d'amont demeure en général en catégorie 3."]
  ],
  formula: ["Amont (kgCO₂e)", "Quantité consommée × Facteur d'amont"],
  example: `1 800 L de gazole. Scope 1 : 1 800 × 2,49 = <b>${f(1800 * R.gazoleComb)} kgCO₂e</b>. Scope 3, catégorie 3 : 1 800 × 0,61 = <b>${f(1800 * R.gazoleAmont)} kgCO₂e</b>. Total : ${f(1800 * R.feGazole)} kgCO₂e, soit 1 800 × 3,10.`,
  limits: ["Les facteurs d'amont varient selon l'origine du combustible : le gaz importé par bateau a un amont plus lourd que le gaz arrivé par gazoduc.", "Selon l'outil, le facteur affiché est « combustion seule » ou « amont compris » : vérifie toujours lequel avant de l'appliquer.", "La catégorie 3 dépend entièrement des données des scopes 1 et 2 : une erreur de litres se retrouve dans les deux."],
  bridges: [["m5", "Le facteur de 3,10 kgCO₂e par litre vu dans cette notion est un facteur complet : amont et combustion."], ["m7", "Le facteur d'un mix électrique contient lui aussi une part de combustion et une part d'amont."], ["m11", "L'amont est l'exemple le plus simple d'une émission qui a lieu chez un autre, à cause de nous."]],
  proof: {
    explain: { q: "Explique pourquoi un litre de gazole consommé par un groupe électrogène apparaît à la fois en scope 1 et en scope 3.", model: "Brûler le litre dans notre groupe émet 2,49 kgCO₂e : c'est du scope 1, car la combustion a lieu dans notre équipement. Mais avant d'arriver, ce litre a été extrait, raffiné et transporté, ce qui a émis 0,61 kgCO₂e chez d'autres : c'est du scope 3, catégorie 3. Les deux parts s'additionnent pour donner le facteur complet de 3,10 kgCO₂e par litre. Ce n'est pas un double compte : ce sont deux morceaux distincts de la même chaîne.",
      keys: ["La combustion a lieu chez nous : scope 1 (2,49 kg par litre)", "L'amont a lieu chez d'autres : scope 3, catégorie 3 (0,61 kg par litre)", "Les deux s'additionnent : 3,10 kg par litre", "Ce n'est pas un double compte"] },
    apply: [
      { q: "Un site consomme 100 000 kWh PCS de gaz naturel. Facteurs : 0,181 kgCO₂e/kWh pour la combustion, 0,034 pour l'amont. Que reporte-t-on ?", o: [["18,1 t en scope 1 et 3,4 t en catégorie 3", 1, "", "100 000 × 0,181 = 18 100 kg. 100 000 × 0,034 = 3 400 kg. Total : 21,5 t."], ["21,5 t en scope 1", 0, "amont", "21,5 t est le total. La part d'amont (3,4 t) n'est pas émise sur le site : elle va en scope 3."], ["21,5 t en scope 1 et 3,4 t en catégorie 3", 0, "amont", "L'amont serait compté deux fois : une fois dans le facteur complet, une fois à part."]] },
      { q: "Une entreprise achète 100 % d'électricité renouvelable avec garanties d'origine. Son scope 2 market-based est nul. Sa catégorie 3 liée à l'électricité est…", o: [["en général non nulle", 1, "", "La fabrication des installations et les pertes en ligne restent à compter."], ["nulle elle aussi", 0, "amont", "Un scope 2 nul ne dit rien de l'amont : les installations et les pertes en ligne ont émis."], ["égale à son scope 2 location-based", 0, "amont", "Le location-based mesure la production moyenne du réseau, pas son amont."]] }
    ] } },

{ id: "m15", track: "s3", title: "Les déplacements", sub: "Catégories 6 et 7 : missions et trajets quotidiens", dom: ["trans", "clim", "compta"],
  entry: ["Note de frais, mission à Madrid", ["Vol Paris – Madrid, aller-retour", "2 100 km"], ["Taxi sur place", "60 €"], ["Hôtel", "2 nuits"]],
  ask: "Aucun véhicule de l'entreprise n'a roulé ni volé. Pourquoi ce déplacement entre-t-il dans son bilan, et comment le chiffrer ?",
  body: function () { return `
<p>Trois situations, trois rangements :</p>
<table class="tbl"><tr><th>Situation</th><th>Où va l'émission</th></tr>
<tr><td>Voiture de la flotte, possédée ou contrôlée par l'entreprise</td><td>Scope 1 : le carburant brûle dans son véhicule</td></tr>
<tr><td>Mission en avion, train, taxi, voiture de location ou voiture personnelle</td><td>Scope 3, catégorie 6</td></tr>
<tr><td>Trajet quotidien entre le domicile et le bureau</td><td>Scope 3, catégorie 7</td></tr></table>
<p>Le calcul de base : une <b>distance</b> multipliée par le <b>facteur du mode</b> de transport.</p>
${fig([{ t: "Distance", s: "2 100 km" }, { t: "× Facteur", s: "0,178 kg/km" }, { t: "Émissions", s: "374 kgCO₂e", k: 1 }], { alt: "Distance fois facteur du mode égale émissions", cap: "Un aller-retour Paris – Madrid en avion moyen-courrier, pour un voyageur." })}
${bars([["Avion court-courrier", 230], ["Voiture thermique, seul", 200], ["Avion moyen-courrier", 178], ["Avion long-courrier", 152], ["Train à grande vitesse", 2.9]], "g/km")}
<p class="hint">En grammes de CO₂e par passager et par kilomètre. Avions : traînées de condensation comprises.</p>
<p><b>Les traînées.</b> En altitude, les avions laissent des traînées de condensation qui réchauffent elles aussi le climat. Les compter multiplie le facteur par 1,8 environ. Certains référentiels les incluent, d'autres non : l'écart entre deux bilans vient souvent de là.</p>
<p><b>Quand les kilomètres manquent.</b> L'outil de notes de frais ne donne parfois qu'un montant. On reconstitue alors une distance : montant ÷ prix moyen au kilomètre, puis × facteur. D'après le rapport de durabilité 2025, Worldline procède ainsi pour les taxis, avec 0,20 kg par km.</p>
<p><b>Domicile-travail.</b> Même calcul, répété : distance aller-retour × jours sur site × facteur du mode. Worldline l'estime à partir d'une enquête auprès des salariés. Résultat : 13 562 t en 2025, plus de cinq fois les déplacements professionnels (2 416 t).</p>`; },
  pre: [
    ["Passager-kilomètre : l'unité des transports partagés", "Un avion émet pour tous ses passagers à la fois. On divise donc ses émissions par le nombre de passagers et par la distance : on obtient des kgCO₂e par passager et par kilomètre. Deux collègues sur le même vol comptent deux fois la distance."],
    ["Pourquoi le court-courrier émet-il plus au kilomètre ?", "Le décollage et la montée consomment beaucoup de carburant. Sur un vol court, cette phase pèse lourd dans le total. Sur un vol long, elle est diluée dans des milliers de kilomètres de croisière."],
    ["D'où vient le repère de 0,20 kgCO₂e par km pour une voiture ?", "De la notion 9. Une voiture qui consomme 6,5 L aux 100 km brûle 0,065 L par km. À 3,10 kgCO₂e le litre, cela fait 0,20 kgCO₂e par km. À deux dans la voiture, c'est 0,10 par personne."],
    ["Et les nuits d'hôtel ?", "Le GHG Protocol les laisse en option dans la catégorie 6. Quand on les compte sans donnée physique, on passe par les dépenses : montant × ratio monétaire de l'hébergement."]
  ],
  formula: ["Émissions (kgCO₂e)", "Distance (km) × Voyageurs × Facteur du mode (kgCO₂e par passager.km)"],
  example: `Paris – Madrid aller-retour, 2 100 km en avion moyen-courrier : 2 100 × 0,178 = <b>${f(2100 * 0.178, 0)} kgCO₂e</b>. Le même trajet en train à grande vitesse : 2 100 × 0,0029 = <b>${f(2100 * R.tgv, 0)} kgCO₂e</b>.`,
  limits: ["Le facteur d'un vol dépend de la taille de l'avion, de son remplissage et de la classe : un siège en classe affaires occupe plus de place, donc porte plus d'émissions.", "Le facteur du train dépend du mix électrique du pays : 0,0029 vaut pour un train à grande vitesse en France.", "Compter ou non les traînées change le résultat d'un facteur 1,8 : deux bilans ne se comparent que s'ils font le même choix.", "Une distance reconstituée à partir d'un montant dépend du prix au kilomètre retenu : c'est une estimation, pas une mesure."],
  bridges: [["m9", "La flotte de véhicules se calcule avec les litres réels : c'est du scope 1, pas de la catégorie 6."], ["m12", "Sans distance ni carburant, il reste la méthode par les dépenses."], ["m7", "Le train et la voiture électrique dépendent du mix électrique du pays traversé."]],
  proof: {
    explain: { q: "Un collègue confond voiture de fonction, mission en train et trajet domicile-travail. Explique où va chacun dans le bilan.", model: "Le carburant d'une voiture que l'entreprise possède ou contrôle est du scope 1 : la combustion a lieu dans son véhicule. Une mission en train, en avion ou en taxi se fait dans le véhicule d'un autre : c'est du scope 3, catégorie 6, calculé par la distance multipliée par le facteur du mode. Le trajet quotidien entre le domicile et le bureau est du scope 3, catégorie 7. Dans les trois cas, le calcul part d'une distance ou d'un volume de carburant.",
      keys: ["Flotte possédée ou contrôlée : scope 1", "Mission dans le véhicule d'un tiers : scope 3, catégorie 6", "Domicile-travail : scope 3, catégorie 7", "Calcul : distance × facteur du mode, ou carburant réel"] },
    apply: [
      { q: "Une salariée fait 25 km aller-retour en voiture thermique, seule, 200 jours par an. Avec 0,20 kgCO₂e par km, ses trajets entre le domicile et le bureau pèsent…", o: [["1 t de CO₂e par an, en catégorie 7", 1, "", "25 × 200 × 0,20 = 1 000 kgCO₂e."], ["1 t de CO₂e par an, en catégorie 6", 0, "s3trav", "Le calcul est juste, mais le trajet quotidien vers le bureau n'est pas une mission : catégorie 7."], ["5 kgCO₂e par an", 0, "s3trav", "5 kg, c'est une seule journée. Multiplie par les 200 jours."]] },
      { q: "Un taxi coûte 60 €. Le prix moyen est de 2 € par km et le facteur de 0,20 kgCO₂e par km. Les émissions estimées sont de…", o: [["6 kgCO₂e", 1, "", "60 ÷ 2 = 30 km reconstitués. 30 × 0,20 = 6 kgCO₂e."], ["12 kgCO₂e", 0, "s3trav", "Tu as multiplié le montant par le facteur. Il faut d'abord retrouver la distance : montant ÷ prix au km."], ["24 kgCO₂e", 0, "s3trav", "Tu as multiplié par le prix au km au lieu de diviser."]] }
    ] } },

{ id: "m16", track: "s3", title: "Les actifs loués", sub: "Catégories 8 et 13 : qui tient le compteur ?", dom: ["bat", "compta", "pol"],
  entry: ["Bail de bureaux", ["Surface louée", "2 000 m²"], ["Énergie", "Gérée par le bailleur, refacturée dans les charges"]],
  ask: "L'entreprise occupe ces bureaux mais ne tient aucun contrat d'énergie. Où vont les émissions du chauffage et de l'électricité ?",
  body: function () { return `
<p>Un bail met face à face deux parties : le <b>bailleur</b>, qui possède l'actif, et le <b>preneur</b>, qui le loue. L'énergie consommée dans l'actif émet une seule fois, mais chacun des deux doit la compter. La question est : dans quel scope ?</p>
<p>Le critère est le <b>contrôle opérationnel</b> : qui exploite l'actif au quotidien, tient les contrats d'énergie et règle les équipements ?</p>
${fig([{ t: "Bailleur", s: "possède" }, { t: "Exploitant", s: "scopes 1 et 2", k: 1 }, { t: "Preneur", s: "occupe" }], { alt: "Bailleur, exploitant, preneur", cap: "L'exploitant est soit le bailleur, soit le preneur. Lui compte l'énergie en scopes 1 et 2. L'autre la compte en scope 3 : catégorie 8 pour le preneur, catégorie 13 pour le bailleur." })}
<table class="tbl"><tr><th>Qui exploite ?</th><th>Pour le preneur</th><th>Pour le bailleur</th></tr>
<tr><td>Le preneur</td><td>Scopes 1 et 2</td><td>Scope 3, catégorie 13</td></tr>
<tr><td>Le bailleur</td><td>Scope 3, catégorie 8</td><td>Scopes 1 et 2</td></tr></table>
<p><b>Le calcul</b> ne dépend pas du bail. Si les consommations réelles sont connues : kWh × facteur, comme pour un site en propre. Sinon, on estime : surface × consommation moyenne par m² × facteur. À défaut encore : loyers et charges × ratio monétaire.</p>
<p>Chez Worldline, la catégorie 8 pèse 27 134 t en 2025. D'après le rapport, elle porte surtout sur la location et le fonctionnement de bureaux et de voitures de société, et se calcule par les dépenses, comme la catégorie 1. Le carburant des voitures thermiques de la flotte reste, lui, en scope 1.</p>`; },
  pre: [
    ["Bailleur, preneur : les mots du bail", "Le bailleur possède l'actif et le donne en location. Le preneur le loue et l'utilise. En anglais : lessor et lessee. « Upstream leased assets » (catégorie 8) se lit du point de vue du preneur. « Downstream leased assets » (catégorie 13) se lit du point de vue du bailleur."],
    ["Contrôle opérationnel, contrôle financier", "Ce sont deux façons de tracer le périmètre d'un bilan. En contrôle opérationnel, l'entreprise compte en scopes 1 et 2 ce qu'elle exploite, qu'elle en soit propriétaire ou non. En contrôle financier, elle compte ce dont elle porte les risques et les bénéfices économiques. Le choix se fait une fois, pour tout le bilan, et il est publié."],
    ["Des m² aux kWh", "Quand le compteur n'est pas accessible, on multiplie la surface par une consommation moyenne par m² : c'est l'intensité énergétique de la notion 8. Le résultat est une estimation, à remplacer par le relevé réel dès qu'il est disponible."]
  ],
  formula: ["Émissions estimées (kgCO₂e)", "Surface (m²) × Intensité (kWh/m²) × Facteur (kgCO₂e/kWh)"],
  example: `2 000 m² loués, en supposant 150 kWh d'électricité par m² et par an : ${f(2000 * 150)} kWh. En France : × 0,052 = <b>${f(2000 * 150 * R.feElecFR / 1000)} tCO₂e</b>. Avec le facteur moyen de l'Union européenne (0,21) : <b>${f(2000 * 150 * R.feElecUE / 1000)} tCO₂e</b>.`,
  limits: ["Le classement dépend de l'approche de consolidation de l'entreprise : en contrôle financier, une location simple renvoie les émissions en catégorie 8, même si le locataire règle lui-même le chauffage.", "Une estimation par les m² ignore l'état réel du bâtiment : deux immeubles de même surface peuvent consommer du simple au triple.", "Bailleur et preneur comptent chacun les mêmes émissions, dans des scopes différents : c'est normal, leurs bilans ne s'additionnent pas.", "Une salle louée dans un centre de données en colocation suit la même logique, mais le classement retenu varie d'une entreprise à l'autre."],
  bridges: [["m8", "L'intensité d'un bâtiment, en kWh par m², sert ici à estimer une consommation qu'on ne mesure pas."], ["m7", "Le pays du bâtiment fixe le facteur de l'électricité : le même bureau pèse quatre fois plus dans l'Union européenne qu'en France."], ["m11", "Les actifs loués montrent que le scope dépend de qui tient la source, pas de qui occupe les lieux."]],
  proof: {
    explain: { q: "Explique à un gestionnaire d'immeubles pourquoi l'énergie d'un bureau loué peut aller en scope 2 ou en scope 3 selon le bail.", model: "Tout dépend de qui exploite le bâtiment. Si nous tenons le contrat d'électricité et réglons les équipements, nous avons le contrôle opérationnel : l'énergie va dans nos scopes 1 et 2, comme pour un site en propre. Si le bailleur exploite l'immeuble et nous refacture l'énergie dans les charges, c'est lui qui la compte en scopes 1 et 2 ; nous la comptons en scope 3, catégorie 8. Dans les deux cas le calcul est le même : des kWh multipliés par un facteur, ou une estimation par la surface si le relevé manque.",
      keys: ["Le critère est le contrôle opérationnel : qui exploite l'actif", "Nous exploitons : scopes 1 et 2", "Le bailleur exploite : scope 3, catégorie 8 pour nous", "Le calcul reste kWh × facteur, ou une estimation par les m²"] },
    apply: [
      { q: "Une entreprise possède un étage de bureaux qu'elle loue à une autre société. Cette société tient son propre contrat d'électricité. Pour l'entreprise propriétaire, ces émissions relèvent…", o: [["du scope 3, catégorie 13", 1, "", "Elle est bailleur et n'exploite pas l'actif : actifs loués en aval."], ["du scope 3, catégorie 8", 0, "s3lease", "La catégorie 8 concerne ce que l'entreprise loue en tant que preneur. Ici, elle est bailleur."], ["du scope 2", 0, "s3lease", "Elle n'achète pas cette électricité et n'exploite pas les locaux."]] },
      { q: "Un bureau loué de 1 000 m² n'a pas de compteur accessible. On estime 200 kWh par m² et par an, sur un réseau à 0,35 kgCO₂e/kWh. Les émissions estimées sont de…", o: [["70 tCO₂e", 1, "", "1 000 × 200 = 200 000 kWh. 200 000 × 0,35 = 70 000 kgCO₂e."], ["200 tCO₂e", 0, "s3lease", "200 000 est le nombre de kWh. Il reste à appliquer le facteur d'émission."], ["0,07 tCO₂e", 0, "fe", "0,07 t est le résultat pour un seul m². Multiplie par la surface."]] }
    ] } },

{ id: "m17", track: "s3", title: "L'usage des produits vendus", sub: "Catégories 11 et 12 : toute une vie, comptée l'année de la vente", dom: ["prod", "elec", "compta"],
  entry: ["Ventes de l'année", ["Terminaux de paiement vendus", "100 000"], ["Puissance moyenne en service", "5 W"], ["Durée de vie prévue", "5 ans"]],
  ask: "Ces terminaux consommeront de l'électricité chez les commerçants pendant cinq ans. Qui compte ces émissions, et quand ?",
  body: function () { return `
<p>Un produit qui consomme de l'énergie émet pendant toute sa vie, chez le client. Pour le client, c'est du scope 2. Pour l'entreprise qui l'a vendu, c'est du scope 3, <b>catégorie 11</b> : l'usage des produits vendus.</p>
<p>La règle de temps surprend : on compte, <b>l'année de la vente</b>, les émissions de <b>toute la durée de vie</b> des produits vendus cette année-là.</p>
${fig([{ t: "Puissance", s: "5 W" }, { t: "× Durée", s: "5 ans" }, { t: "Énergie", s: "219 kWh", k: 1 }], { alt: "Puissance fois durée de vie égale énergie", cap: "Un terminal de 5 W allumé en continu pendant cinq ans consomme 219 kWh. C'est la notion 1, étendue à toute une vie." })}
<p>Il reste à multiplier par le nombre d'unités vendues, puis par le facteur d'émission du pays où le produit est utilisé.</p>
<p><b>La fin de vie</b> suit la même règle : la collecte et le traitement des produits vendus dans l'année, quand ils seront jetés, vont en catégorie 12, dès l'année de la vente.</p>
<p>Chez Worldline, la catégorie 11 pèse 101 093 t en 2025, soit 32 % du scope 3. D'après le rapport, le calcul part d'une analyse de cycle de vie d'une <b>transaction de paiement</b> (carte, terminal, centres de données, ticket), multipliée par les volumes de transactions. L'unité d'usage est alors la transaction, et non le terminal : environ 2,45 g de CO₂e pour un paiement en magasin.</p>`; },
  pre: [
    ["Watts, heures, années : retrouver l'énergie d'une vie", "Énergie = puissance × durée. Une année compte 8 760 heures. Un appareil de 5 W, soit 0,005 kW, consomme 0,005 × 8 760 = 43,8 kWh par an s'il reste allumé en continu."],
    ["Pourquoi tout compter l'année de la vente ?", "Parce que c'est l'année où l'entreprise prend la décision qui engage ces émissions : mettre le produit sur le marché. Si l'on attendait qu'elles se produisent, le bilan d'une année mélangerait les ventes de plusieurs années, et l'effet d'un produit mieux conçu n'apparaîtrait que très lentement."],
    ["Des grammes aux tonnes", "Un gramme par transaction paraît négligeable. Mais un milliard de grammes font 1 000 tonnes. Pour passer des grammes aux tonnes, on divise par un million."]
  ],
  formula: ["Émissions d'usage (kgCO₂e)", "Unités vendues × Énergie sur la durée de vie (kWh) × Facteur (kgCO₂e/kWh)"],
  example: `100 000 terminaux × 219 kWh = 21,9 millions de kWh. Avec le facteur moyen de l'Union européenne (0,21) : <b>${f(100000 * 219 * R.feElecUE / 1000, 0)} tCO₂e</b>, comptées en totalité l'année de la vente.`,
  limits: ["La durée de vie et le profil d'usage sont des hypothèses : passer de 5 à 7 ans augmente le résultat de 40 %, sans rien changer au produit.", "Le facteur dépend du pays d'usage, et du mix électrique des années à venir, qu'on ne connaît pas.", "Allonger la durée de vie d'un produit alourdit sa catégorie 11, mais évite d'en fabriquer un autre : un bon choix peut dégrader un indicateur.", "Worldline raisonne par transaction, à partir d'une analyse de cycle de vie : les deux approches ne donnent pas le même chiffre."],
  bridges: [["m1", "Puissance × durée : le calcul de la notion 1, appliqué à toute la vie d'un produit."], ["m7", "Le pays d'usage fixe le facteur : le même terminal pèse près de neuf fois plus avec le mix mondial qu'en France."], ["m12", "Acheter les terminaux relève de la catégorie 1. Leur usage chez le client relève de la catégorie 11."]],
  proof: {
    explain: { q: "Explique pourquoi les émissions d'un terminal utilisé cinq ans chez un commerçant figurent dans le bilan de l'entreprise qui l'a vendu, et à quelle date.", model: "Le terminal consomme de l'électricité chez le commerçant pendant toute sa vie. Pour le commerçant, c'est du scope 2. Pour l'entreprise qui l'a vendu, c'est du scope 3, catégorie 11 : usage des produits vendus. On compte en une fois, l'année de la vente, les émissions de toute la durée de vie : nombre de terminaux, multiplié par l'énergie consommée sur la durée de vie, multiplié par le facteur du pays d'usage. Le résultat repose sur des hypothèses de durée de vie et d'usage, qu'il faut publier.",
      keys: ["Le produit émet chez le client : scope 2 du client, scope 3 catégorie 11 du vendeur", "Toute la durée de vie est comptée l'année de la vente", "Unités × énergie sur la durée de vie × facteur", "Le résultat dépend d'hypothèses de durée de vie et d'usage"] },
    apply: [
      { q: "Un paiement en magasin pèse environ 2,45 g de CO₂e sur son cycle de vie. Combien pèse un milliard de paiements ?", o: [["2 450 tCO₂e", 1, "", "1 milliard × 2,45 g = 2,45 milliards de grammes, soit 2 450 000 kg, soit 2 450 t."], ["2,45 tCO₂e", 0, "fe", "Il manque un facteur 1 000 : un milliard de grammes font 1 000 tonnes."], ["2 450 000 tCO₂e", 0, "fe", "C'est le résultat en kilogrammes, pas en tonnes."]] },
      { q: "Une entreprise vend 10 000 terminaux en 2026. Chacun consommera 40 kWh par an pendant 5 ans. Quelle énergie d'usage entre dans la catégorie 11 du bilan 2026 ?", o: [["2 000 000 kWh", 1, "", "10 000 × 40 × 5 = 2 000 000 kWh : toute la durée de vie, dès l'année de la vente."], ["400 000 kWh", 0, "s3use", "C'est la consommation d'une seule année. La catégorie 11 compte toute la durée de vie."], ["Aucune : c'est le scope 2 des clients", 0, "s3use", "C'est bien le scope 2 des clients, et c'est aussi le scope 3 du vendeur : la même émission figure dans les deux bilans."]] }
    ] } }
];

var G = WL.GEN;

G.m11 = function () { var s = pick([[6000, 3000, 21000], [1200, 800, 8000], [15000, 5000, 30000], [400, 600, 9000], [9000, 3000, 8000]]), t = s[0] + s[1] + s[2], a = s[2] / t * 100;

G.m12 = function () { var fam = pick(FAM);

      [`En milliers d'euros : ${f(eur)} € = ${f(eur / 1000)} k€.`, `${f(eur / 1000)} × ${fam[1]} = ${f(eur / 1000 * fam[1], 0)} kgCO₂e.`, `En tonnes : ${f(a, 2)} tCO₂e.`],

  var d = pick([120, 250, 400, 800, 1500, 3200]), e = d * fam[1] / 1000;
  return num(`Une entreprise a dépensé ${f(d)} k€ HT en ${fam[0]}. Avec un ratio de ${fam[1]} kgCO₂e/k€, quelles sont les émissions, en tonnes de CO₂e ?`, e, "tCO₂e",

    [{ v: d * fam[1], tag: "spend", msg: "Ton résultat est 1 000 fois trop grand : il est en kilogrammes, ou tu as lu la dépense en euros au lieu de milliers d'euros." }, { v: d / fam[1], tag: "spend", msg: "Tu as divisé par le ratio. Chaque millier d'euros « pèse » des kilogrammes : on multiplie." }]); };

G.m13 = function () { var d0 = pick([2000, 3000, 4000, 5000]), d1 = d0 + pick([500, 1000, 1500]), r0 = pick([170, 250, 320]), r1 = r0 - pick([20, 34, 50]);
  if (Math.random() < 0.5) { var vol = (d1 - d0) * r0 / 1000;
    return num(`Les dépenses d'une famille d'achats passent de ${f(d0)} à ${f(d1)} k€. Son ratio passe de ${r0} à ${r1} kgCO₂e/k€. Quel est l'effet volume, en tonnes de CO₂e ?`, vol, "tCO₂e",
      ["Effet volume = (dépense de l'année 2 − dépense de l'année 1) × ratio de l'année 1.", `(${f(d1)} − ${f(d0)}) × ${r0} = ${f((d1 - d0) * r0, 0)} kgCO₂e, soit ${f(vol, 1)} tCO₂e.`],
      [{ v: (d1 - d0) * r1 / 1000, tag: "s3var", msg: "Tu as utilisé le ratio de l'année 2. Pour isoler le volume, on garde le ratio de l'année 1." }, { v: (d1 * r1 - d0 * r0) / 1000, tag: "s3var", msg: "Tu as calculé l'écart total. L'effet volume ne retient que le changement de dépenses, à ratio inchangé." }, { v: (d1 - d0) * r0, tag: "fe", msg: "C'est le résultat en kilogrammes. En tonnes, divise par 1 000." }]); }
  var ec = (d1 - d0) * r1 / 1000;
  return num(`Les dépenses d'une famille d'achats passent de ${f(d0)} à ${f(d1)} k€. Son ratio a été mis à jour de ${r0} à ${r1} kgCO₂e/k€. On recalcule les deux années avec le nouveau ratio. Quel est alors l'écart d'émissions, en tonnes de CO₂e ?`, ec, "tCO₂e",
    ["À méthode constante, les deux années utilisent le même ratio : le nouveau.", `(${f(d1)} − ${f(d0)}) × ${r1} = ${f((d1 - d0) * r1, 0)} kgCO₂e, soit ${f(ec, 1)} tCO₂e.`],
    [{ v: (d1 * r1 - d0 * r0) / 1000, tag: "s3var", msg: "Tu as gardé l'ancien ratio pour l'année 1. À méthode constante, les deux années utilisent le même ratio." }, { v: (d1 - d0) * r0 / 1000, tag: "s3var", msg: "Tu as pris l'ancien ratio. On recalcule avec le nouveau, celui de la méthode en vigueur." }]); };

G.m14 = function () { var e = pick([["de gazole", "L", "litre", R.gazoleComb, R.gazoleAmont, [1200, 1800, 2500, 4000]], ["de gaz naturel", "kWh PCS", "kWh", R.gazComb, R.gazAmont, [84300, 100000, 250000]]]), q = pick(e[5]);

    var rows = r.rows.map(function (x) { return '<div class="res' + (x.hi ? ' hi' : '') + '"><span>' + esc(x.l) + '</span><b>' + f(x.v) + ' <small>' + esc(x.u) + '</small></b></div>'; }).join("");
    var ch = lab.params.filter(function (q) { return p[q.k] !== base[q.k]; }).map(function (q) {
      return q.type === "sel" ? q.l + " : " + q.opts[base[q.k]][0] + " → " + q.opts[p[q.k]][0] : q.l + " : " + f(base[q.k]) + " → " + f(p[q.k]) + (q.u ? " " + q.u : "");
    });
    var delta = "";
    if (ch.length) {
      var r0 = lab.calc(vals(base)), pct = r0.main ? (r.main / r0.main - 1) * 100 : null;
      delta = '<div class="delta"><b>Pourquoi le résultat change</b><p>Tu as modifié ' + esc(ch.join(" ; ")) + '. ' + esc(hi.l) + ' : ' + f(r0.main) + ' → ' + f(r.main) + ' ' + esc(hi.u)
        + (pct == null ? '' : ' (' + (pct >= 0 ? '+' : '−') + f(Math.abs(pct), 1) + ' %)') + '.</p><p>' + esc(lab.law) + '</p></div>';
    }
    return rows + (r.bars ? barsHtml(r.bars) : '') + (r.note ? '<p class="hint" style="margin-top:8px">' + esc(r.note) + '</p>' : '') + delta;
  }
  function paramsHtml() {
    return lab.params.map(function (q) {
      if (q.type === "sel") {
        return '<div class="prm"><label>' + esc(q.l) + '</label><div class="seg">' + q.opts.map(function (o, i) { return '<button data-sel="' + q.k + '" data-i="' + i + '" aria-pressed="' + (p[q.k] === i) + '"' + (locked ? ' disabled' : '') + '>' + esc(o[0]) + '</button>'; }).join("") + '</div></div>';
      }
      return '<div class="prm"><label for="r-' + q.k + '">' + esc(q.l) + '<b id="v-' + q.k + '">' + f(p[q.k]) + (q.u ? ' ' + q.u : '') + '</b></label>'
        + '<input type="range" id="r-' + q.k + '" data-k="' + q.k + '" min="' + q.min + '" max="' + q.max + '" step="' + q.step + '" value="' + p[q.k] + '"' + (locked ? ' disabled' : '') + '></div>';
    }).join("");
  }
  function draw(keepScroll) {
    var y = window.scrollY, ch = "";
    if (stage < n) {
      var pr = lab.predicts[stage];
      if (!order) { order = A.shuffle(pr.o.map(function (_, i) { return i; })); }
      ch = '<div class="card chal"><p class="mono hint">Défi ' + (stage + 1) + ' / ' + n + ' · prévois avant de tester</p><h2 class="q-title" style="margin-top:4px">' + esc(pr.q) + '</h2>';
      if (!verdict) {
        ch += '<div class="gap-s" style="margin-top:12px">' + order.map(function (oi) { return '<button class="choice" data-pred="' + oi + '"><span>' + esc(pr.o[oi]) + '</span>' + ui("chev") + '</button>'; }).join("") + '</div>'
          + '<button class="linkbtn" id="skip">Passer les défis et explorer librement</button>';
      } else {
        ch += '<div class="fb' + (verdict.ok ? '' : ' ko') + '" style="margin-top:12px"><h3>' + (verdict.ok ? 'Bien prévu.' : 'Ta prévision : « ' + esc(pr.o[verdict.oi]) + ' ». Réponse : « ' + esc(pr.o[pr.a]) + ' ».') + '</h3><p>' + esc(pr.why) + '</p></div>'
          + (!verdict.ok && WL.CONF[pr.tag] ? '<p class="hint" style="margin-top:8px">Confusion repérée : ' + esc(WL.CONF[pr.tag].name) + '. Elle est notée dans « Réviser ».</p>' : '')
          + '<p class="hint" style="margin-top:8px">Le simulateur ci-dessous affiche ce cas. Bouge les curseurs pour voir ce qui change, puis continue.</p>'
          + '<button class="btn" id="nextc" style="margin-top:12px">' + (stage + 1 < n ? 'Défi suivant' : 'Explorer librement') + '</button>';
      }
      ch += '</div>';
    }
    A.main.innerHTML =
      '<div class="page"><button class="back" id="back">' + ui("back") + esc(m.title) + '</button><p class="mono hint">Simulateur</p><h1>' + esc(lab.title) + '</h1></div>'
      + '<div class="stack" style="margin-top:14px">' + ch
      + '<div class="card sim"><div id="prm">' + paramsHtml() + '</div><div id="res" class="resbox">' + (locked ? '<p class="lock">Réponds au défi pour afficher le résultat.</p>' : resHtml()) + '</div></div>'
      + (stage >= n ? '<div class="callout reflex">' + ui("bulb") + '<div><h3>La loi à retenir</h3><p>' + esc(lab.law) + ' Vérifie-la en bougeant un seul curseur à la fois.</p></div></div>'
        + '<button class="btn" id="toproof">Prouver que je sais</button>' + (n ? '<button class="btn ghost" id="redo">Refaire les défis</button>' : '') : '')
      + '</div>';
    $("#back").addEventListener("click", function () { A.go("comp", { t: "mod", id: id }); });
    on("[data-pred]", function (b) {
      var oi = parseInt(b.getAttribute("data-pred"), 10), pr = lab.predicts[stage], ok = oi === pr.a;
      verdict = { ok: ok, oi: oi }; locked = false; base = copy();
      if (!ok) { conf(pr.tag, false); } A.buzz(ok ? 15 : [30, 40, 30]); A.save(); draw(true);
    });
    var sk = $("#skip"); if (sk) { sk.addEventListener("click", function () { stage = n; locked = false; verdict = null; base = copy(); st.lab = 1; A.save(); draw(true); }); }
    var nc = $("#nextc"); if (nc) { nc.addEventListener("click", function () {
      stage++; verdict = null; order = null;
      if (stage < n) { locked = true; setP(lab.predicts[stage].set); } else { st.lab = 1; A.save(); }
      base = copy(); draw(); A.toTop();
    }); }
    var rd = $("#redo"); if (rd) { rd.addEventListener("click", function () { stage = 0; verdict = null; order = null; locked = true; setP(lab.predicts[0].set); base = copy(); draw(); A.toTop(); }); }
    var tp = $("#toproof"); if (tp) { tp.addEventListener("click", function () { A.go("comp", { t: "proof", id: id }); }); }
    $$("input[type=range]").forEach(function (r) {
      r.addEventListener("input", function () {
        var k = r.getAttribute("data-k"), q = lab.params.filter(function (x) { return x.k === k; })[0];
        p[k] = parseFloat(r.value); $("#v-" + k).textContent = f(p[k]) + (q.u ? " " + q.u : ""); $("#res").innerHTML = resHtml();
      });
    });
    on("[data-sel]", function (b) {
      var k = b.getAttribute("data-sel"); p[k] = parseInt(b.getAttribute("data-i"), 10);
      $$('[data-sel="' + k + '"]').forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); $("#res").innerHTML = resHtml();
    });
    if (keepScroll) { try { window.scrollTo(0, y); } catch (e) {} }
  }
  draw();
}

/* ---------- épreuve : expliquer, calculer, appliquer ---------- */
function renderProof(id, rev) {
  var m = WL.MOD[id], st = ms(id), steps = rev ? ["calc", "apply"] : ["explain", "calc", "apply"], i = 0, failed = false;
  var names = { explain: "Expliquer", calc: "Calculer", apply: "Appliquer ailleurs" };
  function head() {
    return '<div class="page"><button class="back" id="back">' + ui("back") + esc(m.title) + '</button><p class="mono hint">' + (rev ? 'Révision' : 'Épreuve') + ' · étape ' + (i + 1) + ' / ' + steps.length + '</p><h1>' + names[steps[i]] + '</h1></div>'
      + '<div class="track"><i style="width:' + Math.round(100 * i / steps.length) + '%"></i></div>';
  }
  function back() { $("#back").addEventListener("click", function () { rev ? A.go("rev") : A.go("comp", { t: "mod", id: id }); }); }
  function nextBtn(box, label) {
    var b = document.createElement("button"); b.className = "btn"; b.style.marginTop = "14px"; b.textContent = label || (i + 1 < steps.length ? "Étape suivante" : "Terminer");
    b.addEventListener("click", function () { i++; if (i >= steps.length) { finish(); } else { step(); } }); box.appendChild(b);
    try { b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }
  function retryBtn(box, label, fn) {
    var b = document.createElement("button"); b.className = "btn"; b.style.marginTop = "14px"; b.textContent = label; b.addEventListener("click", fn); box.appendChild(b);
    try { b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
  }
  function step() {
    var k = steps[i]; A.toTop();
    if (k === "explain") {
      var ex = m.proof.explain;
      A.main.innerHTML = head() + '<div class="stack"><h2 class="q-title">' + esc(ex.q) + '</h2>'
        + '<p class="hint">Écris ta réponse, ou dis-la à voix haute. Tu la compareras ensuite à une réponse modèle.</p>'
        + '<textarea id="ans" rows="5" placeholder="Ta réponse, avec tes mots"></textarea><button class="btn" id="cmp">Comparer avec la réponse modèle</button><div id="model"></div></div>';
      back();
      $("#cmp").addEventListener("click", function () {
        $("#cmp").hidden = true;
        $("#model").innerHTML = '<div class="card"><b>Réponse modèle</b><p style="margin-top:6px">' + esc(ex.model) + '</p></div>'
          + '<h2 class="sec">Coche ce que ta réponse contenait</h2><div class="gap-s">' + ex.keys.map(function (t, j) { return '<label class="chk"><input type="checkbox" data-key="' + j + '"><span>' + esc(t) + '</span></label>'; }).join("") + '</div>'
          + '<button class="btn" id="okx" style="margin-top:14px">Valider mon explication</button><div id="xfb"></div>';
        $("#okx").addEventListener("click", function () {
          var c = $$("[data-key]").filter(function (x) { return x.checked; }).length, need = ex.keys.length - 1;
          if (c >= need) { $("#okx").hidden = true; $("#xfb").innerHTML = '<div class="fb"><h3>Explication validée.</h3><p>' + (c === ex.keys.length ? 'Tous les points clés y sont.' : 'Il manquait un point : relis-le dans la réponse modèle.') + '</p></div>'; nextBtn($("#xfb")); }
          else { $("#xfb").innerHTML = '<div class="fb ko"><h3>Il manque ' + (ex.keys.length - c) + ' points clés.</h3><p>Relis la réponse modèle, cache-la mentalement, puis reformule en incluant les points non cochés. Coche-les quand tu sais les dire.</p></div>'; }
        });
      });
    } else if (k === "calc") {
      A.main.innerHTML = head() + '<div class="stack"><p class="hint">Un calcul avec des valeurs nouvelles. Deux essais : au premier écart, tu reçois un diagnostic.</p><div id="ex"></div><div id="after"></div></div>';
      back();
      var run = function () {
        $("#after").innerHTML = "";
        X.exercise($("#ex"), WL.GEN[id](), function (ok, tag) {
          if (tag) { conf(tag, false); } A.save();
          if (ok) { nextBtn($("#after")); }
          else { failed = true; $("#after").innerHTML = (tag ? diagHtml(tag).replace(/<button class="btn ghost" data-chk[^]*$/, "</div>") : ""); retryBtn($("#after"), "Réessayer avec d'autres valeurs", run); }
        });
      };
      run();
    } else {
      A.main.innerHTML = head() + '<div class="stack"><p class="hint">Une situation que la notion n\'a pas montrée telle quelle.</p><div id="ex"></div><div id="after"></div></div>';
      back();
      var runA = function () {
        $("#after").innerHTML = "";
        var a = m.proof.apply[(st.k || 0) % m.proof.apply.length];
        X.exercise($("#ex"), { type: "mc", q: a.q, o: a.o }, function (ok, tag) {
          if (tag) { conf(tag, false); } A.save();
          if (ok) { nextBtn($("#after")); }
          else { failed = true; st.k = (st.k || 0) + 1; $("#after").innerHTML = (tag ? diagHtml(tag).replace(/<button class="btn ghost" data-chk[^]*$/, "</div>") : ""); retryBtn($("#after"), "Réessayer avec une autre situation", runA); }
        });
      };
      runA();
    }
  }
  function finish() {
    var t = today();
    st.k = (st.k || 0) + 1;
    if (!rev || !st.t) { st.t = st.t || t; st.rev = st.rev || 0; st.due = t + (failed ? 1 : MODINT[0]); }
    else if (failed) { st.due = t + 1; }
    else { st.rev = (st.rev || 0) + 1; st.due = t + MODINT[Math.min(st.rev, MODINT.length - 1)]; }
    A.save(); A.toTop();
    var nxt = WL.MODS[m.n];
    A.main.innerHTML = '<p class="qctx" style="margin-top:10px">' + esc(m.title) + '</p><div class="big">✓</div><p class="verdict">' + (rev ? (failed ? 'Révision faite, à consolider.' : 'Révision réussie.') : 'Notion acquise.') + '</p>'
      + '<div class="card" style="margin-top:16px"><b>Prochaine vérification : ' + dayLabel(st.due) + '</b><p class="hint" style="margin-top:4px">' + (failed ? 'Une étape a demandé plusieurs essais : la notion revient dès demain, avec de nouvelles valeurs.' : 'Tu la retrouveras dans « Réviser », avec un calcul neuf et une autre situation. Chaque réussite espace la suivante.') + '</p></div>'
      + '<div class="stack" style="margin-top:22px">' + (nxt && !rev ? '<button class="btn" id="nx">Notion suivante : ' + esc(nxt.title) + '</button>' : '')
      + '<button class="btn ghost" id="bk">' + (rev ? 'Retour aux révisions' : 'Retour à la notion') + '</button></div>';
    var nx = $("#nx"); if (nx) { nx.addEventListener("click", function () { A.go("comp", { t: "mod", id: nxt.id }); }); }
    $("#bk").addEventListener("click", function () { rev ? A.go("rev") : A.go("comp", { t: "mod", id: id }); });
  }
  step();
}

/* ---------- Réviser ---------- */
X.renderRev = function () {
  var sub = A.S.sub;
  if (sub && sub.t === "conf" && WL.CONF[sub.id]) { return renderConf(sub.id); }
  if (sub && sub.t === "backup") { return renderBackup(); }
  var dq = X.dueQ(), dm = X.dueMods(), t = today(), st = A.store;
  var nextDue = null;
  Object.keys(st.sr).forEach(function (id) { var d = st.sr[id].d; if (d > t && (nextDue == null || d < nextDue)) { nextDue = d; } });
  WL.MODS.forEach(function (m) { var s = st.mods[m.id]; if (s && s.t && s.due > t && (nextDue == null || s.due < nextDue)) { nextDue = s.due; } });
  var todayHtml = "";
  if (dq.length) { todayHtml += '<button class="mode" id="srq"><span class="num">' + ui("target") + '</span><span><span class="t">Questions à revoir</span><br><span class="s">Celles dont l\'échéance est arrivée</span></span><span class="b">' + dq.length + '</span></button>'; }
  dm.forEach(function (m) { todayHtml += '<button class="mode" data-rev="' + m.id + '"><span class="num">' + m.n + '</span><span><span class="t">Re-prouver : ' + esc(m.title) + '</span><br><span class="s">Un calcul neuf, une autre situation</span></span><span class="b">' + ui("chev") + '</span></button>'; });
  if (!todayHtml) {
    todayHtml = '<div class="card"><b>Rien à réviser aujourd\'hui.</b><p class="hint" style="margin-top:4px">' + (nextDue != null ? 'Prochaine échéance : ' + dayLabel(nextDue) + '.' : 'Les révisions se remplissent à mesure que tu réponds aux quiz et que tu valides des notions.') + '</p></div>';

      if (typeof o[1] === "string") { c.stack.push(o[1]); } else { c.result = o[1]; }
      renderClasser(); toTop();
    });
  });
  byId("backf").addEventListener("click", function () { go("fiches"); });
  var bk = byId("back1"); if (bk) { bk.addEventListener("click", function () { c.stack.pop(); c.labels.pop(); renderClasser(); }); }
  Array.prototype.forEach.call(main.querySelectorAll("[data-kpi]"), function (b) {
    b.addEventListener("click", function () { S.tab = "fiches"; S.sub = { t: "kpi", id: b.getAttribute("data-kpi"), from: "classer" }; renderKpi(b.getAttribute("data-kpi"), "classer"); drawTabs(); toTop(); });
  });
}
function renderClassResult() {
  var c = S.cls, r = c.result, k = WL.KPI[r.kpi];
  main.innerHTML =
    '<div class="page"><h1>Classer une donnée</h1></div>'
    + '<div class="crumbs">' + c.labels.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join("") + '</div>'
    + '<div class="stack"><div class="result u-' + k.unit + '">' + WL.ico(k.icon, k.unit)
    + '<p class="mono hint">Tu saisis dans le KPI</p><h2>' + esc(k.en) + '</h2><p>' + esc(k.fr) + '</p>'
    + '<p>Unité attendue : ' + WL.chip(k.unit, true) + '</p></div>'
    + (r.note ? '<div class="callout warn">' + ui("warn") + '<div><h3>À retenir</h3><p>' + esc(r.note) + '</p></div></div>' : '')
    + '<div class="callout reflex">' + ui("bulb") + '<div><h3>Question réflexe</h3><p>' + esc(k.reflex) + '</p></div></div>'
    + '<button class="btn" id="open">Ouvrir la fiche</button><button class="btn ghost" id="again">Classer une autre donnée</button></div>';
  byId("open").addEventListener("click", function () { S.tab = "fiches"; S.sub = { t: "kpi", id: k.id }; renderKpi(k.id, "classer"); drawTabs(); toTop(); });
  byId("again").addEventListener("click", function () { S.cls = { stack: ["start"], labels: [], result: null }; renderClasser(); toTop(); });
}

/* ---------- Quiz ---------- */
function renderQuizHome() {
  cleanMissed();
  var modes = WL.MODES.map(function (m) {
    var n = m.id === "mix" ? 10 : WL.Q.filter(function (q) { return m.id === "unit" ? q.th === "unit" : q.th === m.id; }).length;
    var b = store.best[m.id];
    return '<button class="mode" data-mode="' + m.id + '"><span class="num">' + ui(m.icon) + '</span><span><span class="t">' + m.name + '</span><br><span class="s">' + m.sub + ' · ' + n + ' questions</span></span>'
      + '<span class="b">' + (b ? b.s + '/' + b.t : '') + '</span></button>';
  }).join("");
  main.innerHTML =
    '<div class="page"><h1>Quiz</h1><p class="sub">' + WL.Q.length + ' questions pour fixer les réflexes. Chaque erreur déclenche un diagnostic, puis revient dans « Réviser » après quelques jours.</p></div>'
    + '<div class="stack" style="margin-top:16px">' + modes
    + '<button class="mode" id="review"' + (store.missed.length ? '' : ' disabled style="opacity:.55"') + '><span class="num">' + ui("warn") + '</span><span><span class="t">À revoir</span><br><span class="s">Tes erreurs, jusqu\'à ce qu\'elles soient justes</span></span><span class="b">' + store.missed.length + '</span></button></div>';
  Array.prototype.forEach.call(main.querySelectorAll("[data-mode]"), function (b) {
    b.addEventListener("click", function () { startMode(b.getAttribute("data-mode")); });
  });
  byId("review").addEventListener("click", function () { if (store.missed.length) { start("review", "À revoir", shuffle(store.missed)); } });
}
function pool(mode) {
  if (mode === "mix") { return shuffle(WL.Q.map(function (q) { return q.id; })).slice(0, 10); }
  return shuffle(WL.Q.filter(function (q) { return q.th === mode; }).map(function (q) { return q.id; }));
}
function startMode(mode) {
  var m = WL.MODES.filter(function (x) { return x.id === mode; })[0];
  start(mode, m.name, pool(mode));
}
function start(key, label, ids) {
  S.tab = "quiz"; S.sub = null;
  sess = { key: key, label: label, ids: ids, i: 0, score: 0, wrong: [], answered: false, order: null, done: false };
  renderQuestion();
}
function qDoc(q) {
  if (!q.d) { return ""; }
  return '<div class="doc sm"><header><span>' + esc(q.d[0]) + '</span><em>exemple fictif</em></header>'
    + q.d.slice(1).map(function (l) { return '<div class="drow single"><span>' + esc(l) + '</span></div>'; }).join("") + '<div class="dpad"></div></div>';
}
function renderQuestion() {
  var s = sess, q = QBY[s.ids[s.i]]; toTop(); drawTabs();
  if (!s.order) { var idx = q.o.map(function (_, i) { return i; }); s.order = q.fix ? idx : shuffle(idx); }
  var opts = s.order.map(function (oi, pos) {
    return '<li><button class="opt" data-oi="' + oi + '"><span class="ltr">' + "ABCDE"[pos] + '</span><span>' + esc(q.o[oi]) + '</span><span class="mark" aria-hidden="true"></span></button></li>';
  }).join("");
  var n = s.ids.length;
  main.innerHTML =
    '<div class="qtop"><button class="back" id="quit" aria-label="Quitter le quiz">' + ui("back") + 'Quitter</button><span class="count">' + pad(s.i + 1) + ' / ' + pad(n) + '</span></div>'
    + '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + s.i + '"><i style="width:' + Math.round(100 * s.i / n) + '%"></i></div>'
    + (q.ctx ? '<p class="qctx">' + esc(q.ctx) + '</p>' : '<p class="qctx">' + esc(s.label) + '</p>')
    + qDoc(q)
    + '<h2 class="q" id="qtext" tabindex="-1">' + esc(q.q) + '</h2>'
    + '<ul class="opts">' + opts + '</ul><div id="fb"></div><div class="dock" id="dock" hidden></div>';
  byId("quit").addEventListener("click", function () { sess = null; render(); });
  Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
    b.addEventListener("click", function () { answer(parseInt(b.getAttribute("data-oi"), 10)); });
  });
  try { byId("qtext").focus({ preventScroll: true }); } catch (e) {}
}
function answer(oi) {
  var s = sess; if (s.answered) { return; }
  s.answered = true;
  var q = QBY[s.ids[s.i]], ok = oi === q.a;
  if (ok) { s.score++; store.missed = store.missed.filter(function (id) { return id !== q.id; }); buzz(15); }
  else { s.wrong.push(q.id); if (store.missed.indexOf(q.id) < 0) { store.missed.push(q.id); } buzz([30, 40, 30]); }
  var diag = WL.X.onQuiz(q, ok);
  save();
  Array.prototype.forEach.call(main.querySelectorAll(".opt"), function (b) {
    var v = parseInt(b.getAttribute("data-oi"), 10), m = b.querySelector(".mark");
    b.setAttribute("aria-disabled", "true");
    if (v === q.a) { b.classList.add("ok"); m.textContent = "✓"; }
    else if (v === oi) { b.classList.add("ko"); m.textContent = "✗"; }
    else { b.classList.add("dim"); }
  });
  byId("fb").innerHTML = '<div class="fb' + (ok ? '' : ' ko') + '" role="status"><h3>' + (ok ? 'Juste.' : 'Raté.') + '</h3><p>' + esc(q.e) + '</p></div>' + diag;
  WL.X.bindDiag(byId("fb"));
  var last = s.i === s.ids.length - 1, dock = byId("dock");
  dock.hidden = false;
  dock.innerHTML = '<button class="btn" id="next">' + (last ? 'Voir le résultat' : 'Question suivante') + ' →</button>';
  var nb = byId("next"); nb.addEventListener("click", nextQ);
  try { nb.scrollIntoView({ block: "nearest", behavior: "smooth" }); nb.focus({ preventScroll: true }); } catch (e) {}
}
function nextQ() {
  var s = sess; s.i++; s.answered = false; s.order = null;
  if (s.i >= s.ids.length) { finish(); } else { renderQuestion(); }
}
function finish() {
  var s = sess; s.done = true;
  var n = s.ids.length;
  if (s.key !== "review" && s.key !== "sr") { var b = store.best[s.key]; if (!b || s.score / n > b.s / b.t) { store.best[s.key] = { s: s.score, t: n }; } }
  save(); renderResult();
}
function renderResult() {
  var s = sess, n = s.ids.length; toTop(); drawTabs();
  var r = s.score / n, verdict = r >= 0.9 ? "Solide." : r >= 0.7 ? "Bon niveau." : r >= 0.5 ? "À consolider." : "À reprendre.";
  var wrong = s.wrong.length ? '<h2 class="sec" style="margin-top:24px">À retenir</h2><ul class="miss">'
    + s.wrong.map(function (id) { var q = QBY[id]; return '<li><b>' + esc(q.q) + '</b><span>' + esc(q.o[q.a]) + '</span><p class="hint" style="margin-top:4px">' + esc(q.e) + '</p></li>'; }).join("") + '</ul>' : '';
  main.innerHTML =
    '<p class="qctx" style="margin-top:10px">' + esc(s.label) + '</p><div class="big">' + s.score + '<small> / ' + n + '</small></div><p class="verdict">' + verdict + '</p>'
    + wrong
    + '<div class="stack" style="margin-top:22px">'
    + (s.wrong.length ? '<button class="btn" id="redo">Refaire les erreurs (' + s.wrong.length + ')</button>' : '')
    + '<button class="btn' + (s.wrong.length ? ' ghost' : '') + '" id="again">Rejouer</button><button class="btn ghost" id="home">Retour aux quiz</button></div>';
  var rd = byId("redo"); if (rd) { rd.addEventListener("click", function () { start("review", "À revoir", shuffle(s.wrong)); }); }
  byId("again").addEventListener("click", function () {
    if (s.key === "sr") { sess = null; go("rev"); }
    else if (s.key === "review") { cleanMissed(); if (store.missed.length) { start("review", "À revoir", shuffle(store.missed)); } else { sess = null; render(); } }
    else { startMode(s.key); }
  });
  byId("home").addEventListener("click", function () { var sr = s.key === "sr"; sess = null; if (sr) { go("rev"); } else { render(); } });
  if (s.key === "sr") { byId("again").textContent = "Retour aux révisions"; byId("home").hidden = true; }
}

/* ---------- Glossaire ---------- */
function glossRows(qs) {
  var q = qs.trim().toLowerCase();
  var rows = WL.GLOSS.filter(function (g) { return !q || g[0].toLowerCase().indexOf(q) >= 0 || g[1].toLowerCase().indexOf(q) >= 0; });
  if (!rows.length) { return '<div class="empty">Aucun terme ne correspond.</div>'; }
  return rows.map(function (g) { return '<div class="g"><b>' + esc(g[0]) + '</b><span>' + esc(g[1]) + '</span></div>'; }).join("");
}
function renderGloss() {
  main.innerHTML =
    '<div class="page"><button class="back" id="backf">' + ui("back") + 'Fiches</button><h1>Glossaire</h1><p class="sub">' + WL.GLOSS.length + ' termes anglais, avec leur traduction française.</p></div>'
    + '<div class="search"><label>' + ui("search") + '<input id="gq" type="search" inputmode="search" placeholder="Chercher : petrol, essence, steam…" autocomplete="off" aria-label="Chercher un terme"></label></div>'
    + '<div class="list" id="glist" style="margin-top:6px">' + glossRows("") + '</div>';
  byId("backf").addEventListener("click", function () { go("fiches"); });
  byId("gq").addEventListener("input", function () { byId("glist").innerHTML = glossRows(this.value); });
}

/* ---------- démarrage ---------- */
WL.X.init({ ui: ui, esc: esc, shuffle: shuffle, byId: byId, store: store, save: save, load: loadStore, go: go, S: S, main: main, buzz: buzz, toTop: toTop, start: start, startMode: startMode, QBY: QBY });
var hot = window.claude && window.claude.hot;
function boot(data) {
  if (data && data.S && typeof data.S.tab === "string") {
    S.tab = /^(bases|fiches|classer|gloss|comp|quiz|rev|s3)$/.test(data.S.tab) ? data.S.tab : "bases"; S.sub = data.S.sub || null; S.filter = data.S.filter || "all";
    if (data.S.cls && Array.isArray(data.S.cls.stack)) { S.cls = data.S.cls; }
    var d = data.sess;
    if (d && Array.isArray(d.ids) && d.ids.every(function (id) { return QBY[id]; })) {
      sess = d;
      if (!sess.done && sess.answered) { sess.i++; sess.answered = false; sess.order = null; if (sess.i >= sess.ids.length) { finish(); return; } }
    }
    if (S.sub && S.sub.t === "kpi" && !WL.KPI[S.sub.id]) { S.sub = null; }
    if (S.sub && S.sub.t === "cat" && !WL.S3CAT[S.sub.n]) { S.sub = null; }
    if (S.sub && S.sub.t === "lesson" && !WL.LESSONS.some(function (l) { return l.id === S.sub.id; })) { S.sub = null; }
  }
  render();
}
if (hot && typeof hot.snapshot === "function") { hot.snapshot(function () { return { S: S, sess: sess }; }); }
if (hot && typeof hot.ready === "function") { hot.ready(boot); } else { boot((hot && hot.data) || {}); }

})(window.WL);

</script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
